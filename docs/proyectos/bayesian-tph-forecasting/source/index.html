<script>
const FILES=[{"id": "paso-01", "section": "Inicio", "path": "README.md", "description": "Propósito, instalación y comandos reproducibles.", "language": "md", "source": "# Modelo Bayesiano jerárquico para la estimación de tratamiento de molienda esperado\n\nUn proyecto educativo y reproducible que convierte un análisis de rendimiento de molienda en un conjunto de pipelines modulares de <strong><font color=\"darkmagenta\">Kedro<\/font><\/strong>. El caso se construye sobre un circuito de conminución deliberadamente ficticio y usa exclusivamente datos sintéticos generados para este repositorio.\n\nEl objetivo de este caso es explicar, con base en variables estrictamente contextuales, el rendimiento observado de molienda conforme una estrategia de forecasting de tipo *ex post*. La inferencia Bayesiana permite separar el nivel esperado de rendimiento asociado al contexto geológico y de planta del residuo operacional que no explican las variables contextuales disponibles.\n\nEl caso se define como *ex post* debido a que el objetivo es explicar el rendimiento observado, no predecirlo (*ex ante*). Sin embargo, es posible escalar esta metodología para generar pronósticos de rendimiento de molienda conforme planes de producción y estrategias de transporte, siempre que se cuente con un conjunto de datos históricos suficientemente amplio y representativo.\n\n## Pipelines\n\nEl proyecto está constituido por cuatro pipelines modulares que representan las etapas de ingeniería de datos, ciencia de datos, inferencia Bayesiana y reportabilidad:\n\n```text\ndata_engineering -> data_science -> bayesian_inference -> reporting\n```\n\nEn términos de ingeniería de software, cada pipeline es un módulo independiente que puede ejecutarse y probarse aisladamente. En términos de ingeniería de datos, cada pipeline representa una etapa del flujo de trabajo que transforma los datos desde su forma cruda hasta la presentación final de resultados.\n\nLas pipelines previamente mencionadas se encargan, en líneas generales, de las siguientes tareas:\n\n- `data_engineering`: Ingestión de señales operacionales historizadas de la planta concentradora, ciclos de transporte, modelo de dureza in–situ y agregación diaria de variables contextuales.\n- `data_science`: Estimación de firmas geológicas por medio de algoritmos de aggrupamiento, selección de variables contextuales y construcción de la matriz diaria de entrada y salida para nuestro modelo.\n- `bayesian_inference`: Backtesting móvil de la estrategia de forecasting, construcción de un modelo Bayesiano jerárquico y cuantificación de la doble incertidumbre (paramétrica y predictiva).\n- `reporting`: Descomposición de contribuciones de rendimiento, construcción de un gráfico de cascada interactivo y generación de una aplicación web estática para reportabilidad.\n\n## Ejecución del proyecto\n\nEste proyecto se ejecuta por medio de la interfaz de línea de comandos de <strong><font color=\"darkmagenta\">Kedro<\/font><\/strong>, haciendo uso de `uv` como gestor de entornos virtuales. La instalación de dependencias se realiza por medio de la sincronización de entornos virtuales, considerando las librerías registradas en el archivo `pyproject.toml`. En nuestra terminal, la ejecución de este proyecto se realiza con los siguientes comandos:\n\n```bash\nuv sync --extra dev\nuv run kedro run\nuv run kedro viz run\n```\n\nLa instrucción `uv run kedro run` ejecuta todos los pipelines del proyecto, mientras que `uv run kedro viz run` genera un archivo HTML navegable con la visualización del grafo dirigido acíclico (DAG) que permite mapear entradas y salidas de las pipelines y nodos que constituyen el proyecto completo.\n\nEste proyecto incluye un conjunto de pruebas unitarias (*smoke tests*) que permiten validar la integridad de los pipelines y nodos. La ejecución de estas pruebas se realiza con el siguiente comando:\n\n```bash\nuv run kedro run --env test\n```\n\nEstas pruebas unitarias se ejecutan en un entorno virtual aislado, sin acceso a redes privadas ni credenciales de ningún tipo. La ejecución de estas pruebas permite validar la reproducibilidad del proyecto y la integridad de los pipelines y nodos que lo constituyen. No incluyen toda la cobertura establecida en la inferencia Bayesiana, pero permiten validar la integridad de los pipelines y nodos que constituyen el proyecto completo.\n\n## Datos\n\nEl proyecto hace uso de datos generados desde cero que representan señales plausibles de un circuito de conminución. También se incluyen dureza y variables espaciales sintéticas que permiten explicar el rendimiento observado. Las fechas se sitúan intencionalmente en el futuro, las coordenadas pertenecen a un sistema cartesiano local inventado y las capacidades, identificadores, procedencias y relaciones estadísticas fueron definidos para el ejercicio. El generador reproducible se encuentra en `scripts/generate_public_synthetic_data.py`.\n\nEste caso no representa, deriva, transforma ni reproduce datos, activos, coordenadas, calendarios, parámetros o configuraciones de una operación real. Tampoco debe emplearse para inferir las características de una faena determinada: su única finalidad es enseñar arquitectura de datos e inferencia Bayesiana con contratos autocontenidos.\n\nLa procedencia, las salvaguardas y el procedimiento de regeneración están documentados en [DATA_PROVENANCE.md](DATA_PROVENANCE.md).\n\nPor seguridad y confidencialidad, no existen conectores SQL, credenciales ni dependencias de redes privadas.\n\n## Licencia\n\nEste proyecto se distribuye bajo la licencia MIT. Los datos sintéticos incluidos se entregan para educación y reproducibilidad. Cualquier mención de marcas, nombres de productos o servicios es meramente ilustrativa y no implica respaldo ni relación con los propietarios de dichas marcas. Para más información, consulte el archivo [LICENSE](LICENSE).\n"}, {"id": "paso-02", "section": "Inicio", "path": "DATA_PROVENANCE.md", "description": "Procedencia y salvaguardas de los datos públicos.", "language": "md", "source": "# Procedencia y límites de los datos públicos\n\nLos cuatro conjuntos de entrada de este proyecto se generan desde cero mediante\n[`scripts/generate_public_synthetic_data.py`](scripts/generate_public_synthetic_data.py).\nLa semilla fija permite reproducir el ejercicio, pero no reconstruir información\nindustrial externa porque el generador no consume archivos, modelos ni parámetros\nde una operación real.\n\nLas salvaguardas deliberadas son:\n\n- calendario situado en los años 2032–2035;\n- coordenadas cartesianas locales centradas en cero, sin sistema de referencia geográfico;\n- fuentes, equipos y destinos identificados mediante contratos genéricos;\n- capacidades, estados y relaciones estadísticas definidos exclusivamente en el generador;\n- número de registros y geometría espacial creados para el ejercicio;\n- pruebas automáticas que rechazan fechas históricas y coordenadas con apariencia UTM.\n\nEl caso conserva relaciones pedagógicas —composiciones cerradas, granularidades,\ndependencias temporales y consistencia entre tablas—, pero no conserva filas,\nseries, ubicaciones ni parámetros de una fuente industrial. Los datos no deben\ninterpretarse como descripción, aproximación o *benchmark* de una faena.\n\n## Regeneración\n\nDesde la raíz del proyecto Kedro:\n\n```bash\nuv run python scripts/generate_public_synthetic_data.py\nuv run pytest\nuv run kedro run --env test\n```\n\nLa publicación debe regenerar también el explorador de código y Kedro Viz, y debe\nconstruir este último sobre una carpeta vacía para evitar artefactos huérfanos.\n"}, {"id": "paso-03", "section": "Entorno", "path": "pyproject.toml", "description": "Dependencias, metadatos y herramientas del paquete.", "language": "toml", "source": "[build-system]\nrequires = [\"setuptools>=75\", \"wheel\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"bayesian-tph-forecasting\"\nversion = \"0.1.0\"\ndescription = \"Proyecto educativo de Kedro para explicar ex post el rendimiento de un circuito de conminución ficticio.\"\nreadme = \"README.md\"\nrequires-python = \">=3.12,<3.14\"\nlicense = { text = \"MIT\" }\ndependencies = [\n  \"arviz==0.22.0\",\n  \"h5py==3.15.1\",\n  \"kedro==1.5.0\",\n  \"kedro-datasets[pandas,matplotlib,pickle,text,json]==9.5.0\",\n  \"kedro-viz==12.4.0\",\n  \"matplotlib>=3.10,<4\",\n  \"numpy>=2.1,<3\",\n  \"pandas>=2.2,<3\",\n  \"plotly>=6.0,<7\",\n  \"pyarrow>=17,<24\",\n  \"pymc>=5.25,<6\",\n  \"scikit-learn>=1.6,<2\",\n  \"scipy>=1.14,<2\",\n  \"statsmodels>=0.14,<1\",\n]\n\n[project.optional-dependencies]\ndev = [\n  \"pytest>=8.3,<10\",\n  \"pytest-cov>=6,<8\",\n  \"ruff>=0.9,<1\",\n]\n\n[project.scripts]\nbayesian-tph-forecasting = \"bayesian_tph_forecasting.__main__:main\"\n\n[tool.setuptools.packages.find]\nwhere = [\"src\"]\n\n[tool.kedro]\npackage_name = \"bayesian_tph_forecasting\"\nproject_name = \"Bayesian TPH Forecasting\"\nkedro_init_version = \"1.5.0\"\nsource_dir = \"src\"\ntools = [\"Lint\", \"Test\", \"Log\", \"Data Structure\"]\nexample_pipeline = \"False\"\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\naddopts = \"-q\"\n\n[tool.ruff]\nline-length = 100\ntarget-version = \"py312\"\n\n[tool.ruff.lint]\nselect = [\"E\", \"F\", \"I\", \"B\", \"UP\"]\nignore = [\"E501\"]\n\n[tool.kedro_telemetry]\nproject_id = \"f0082d33c58d4fa7ae37a159ba19339d\"\n"}, {"id": "paso-04", "section": "Configuración", "path": "conf/base/parameters.yml", "description": "Supuestos y políticas ajustables.", "language": "yml", "source": "analysis:\n  training_end: \"2034-12-31\"\n  evaluation_start: \"2035-01-01\"\n  evaluation_end: \"2035-12-30\"\n\nplant:\n  stable_feed_min_tph: 700.0\n  stable_power_min_kw: 3500.0\n  intermediate_stockpile_min_m: 8.0\n  discharge_sump_range_pct: [40.0, 90.0]\n  online_threshold: 0.5\n\nspatial:\n  geometry_training_end: \"2034-12-31\"\n  grid_m: 25.0\n  dbscan_eps_m: 140.0\n  dbscan_min_samples: 3\n  min_cycles_per_component: 300\n  min_component_share: 0.005\n  hull_trim_quantile: 0.005\n  max_hardness_match_distance_m: 180.0\n  min_cycles_per_day: 20\n\ngeology_clustering:\n  training_end: \"2034-12-31\"\n  min_clusters: 2\n  max_clusters: 10\n  random_seed: 42\n\nfeatures:\n  min_zone_mean_share_pct: 0.5\n  min_hardness_mean_share_pct: 0.5\n  zone_reference_strategy: most_frequent\n  hardness_reference: hardness_share__medium\n\nbayesian:\n  regular_features:\n    - upstream_available_pct\n    - discharge_sumps_in_range_pct\n    - auxiliary_crushing_available_pct\n    - secondary_grinding_available_pct\n    - penetration_rate_mean\n    - feed_fines_pct_mean\n    - feed_fines_pct_centered_sq\n  prior_std_multiplier: 2.0\n  hac_maxlags: 7\n  zone_scale_prior_tph: 55.0\n  hardness_scale_prior_tph: 45.0\n  cluster_scale_prior_tph: 75.0\n  random_seed: 123\n  sampling:\n    draws: 600\n    tune: 1000\n    chains: 4\n    cores: 4\n    target_accept: 0.99\n    progressbar: true\n\nbacktest:\n  start: \"2035-01-01\"\n  end: \"2035-12-31\"\n  rolling_train_months: 12\n  horizon_months: 2\n  step_months: 2\n  min_train_days: 180\n  min_test_days: 20\n  sampling:\n    draws: 300\n    tune: 500\n    chains: 4\n    cores: 4\n    target_accept: 0.99\n    progressbar: false\n\nreporting:\n  bridge_period: \"2035\"\n  credible_probability: 0.90\n  title: \"Descomposición contextual del rendimiento observado\"\n"}, {"id": "paso-05", "section": "Configuración", "path": "conf/base/catalog.yml", "description": "Entradas, artefactos y capas de datos.", "language": "yml", "source": "# 01_raw: contratos de entrada sintéticos, estáticos y reproducibles.\ngeology_daily_raw:\n  type: pandas.CSVDataset\n  filepath: data/01_raw/geology_daily.csv\n  load_args:\n    parse_dates: [date]\n\nplant_signals_hourly_raw:\n  type: pandas.ParquetDataset\n  filepath: data/01_raw/plant_signals_hourly.parquet\n\nhaulage_cycles_raw:\n  type: pandas.ParquetDataset\n  filepath: data/01_raw/haulage_cycles.parquet\n\nhardness_block_model_raw:\n  type: pandas.ParquetDataset\n  filepath: data/01_raw/hardness_block_model.parquet\n\n# 02_intermediate: tablas limpiadas o enriquecidas, aún cercanas a su fuente.\nplant_signals_hourly_clean:\n  type: pandas.ParquetDataset\n  filepath: data/02_intermediate/plant_signals_hourly_clean.parquet\n\nhaulage_cycles_with_hardness:\n  type: pandas.ParquetDataset\n  filepath: data/02_intermediate/haulage_cycles_with_hardness.parquet\n\nmine_zone_components:\n  type: pandas.ParquetDataset\n  filepath: data/02_intermediate/mine_zone_components.parquet\n\nmine_zone_vertices:\n  type: pandas.ParquetDataset\n  filepath: data/02_intermediate/mine_zone_vertices.parquet\n\n# 03_primary: entidades diarias con semántica de negocio estable.\nplant_target_daily:\n  type: pandas.ParquetDataset\n  filepath: data/03_primary/plant_target_daily.parquet\n\nplant_context_daily:\n  type: pandas.ParquetDataset\n  filepath: data/03_primary/plant_context_daily.parquet\n\ngeology_composition_daily:\n  type: pandas.ParquetDataset\n  filepath: data/03_primary/geology_composition_daily.parquet\n\nspatial_context_daily:\n  type: pandas.ParquetDataset\n  filepath: data/03_primary/spatial_context_daily.parquet\n\n# 04_feature: resultados de aprendizaje no supervisado reutilizables.\ngeological_signatures_daily:\n  type: pandas.ParquetDataset\n  filepath: data/04_feature/geological_signatures_daily.parquet\n\ngeological_clustering_artifact:\n  type: pickle.PickleDataset\n  filepath: data/06_models/geological_clustering_artifact.pkl\n\nclustering_diagnostics:\n  type: pandas.CSVDataset\n  filepath: data/07_model_output/clustering_diagnostics.csv\n\n# 05_model_input: una fila por día y todos los predictores contractuales.\nmodel_input_daily:\n  type: pandas.ParquetDataset\n  filepath: data/05_model_input/model_input_daily.parquet\n\nmodel_input_schema:\n  type: json.JSONDataset\n  filepath: data/05_model_input/model_input_schema.json\n\n# 06_models y 07_model_output: posterior final y resultados del backtesting móvil.\nfinal_inference_data:\n  type: bayesian_tph_forecasting.datasets.inference_data_dataset.InferenceDataDataset\n  filepath: data/06_models/final_inference_data.nc\n\nbacktest_predictions:\n  type: pandas.ParquetDataset\n  filepath: data/07_model_output/backtest_predictions.parquet\n\nbacktest_fold_metrics:\n  type: pandas.CSVDataset\n  filepath: data/07_model_output/backtest_fold_metrics.csv\n\nbacktest_summary:\n  type: pandas.CSVDataset\n  filepath: data/07_model_output/backtest_summary.csv\n\nposterior_parameter_summary:\n  type: pandas.CSVDataset\n  filepath: data/07_model_output/posterior_parameter_summary.csv\n\n# 08_reporting: productos finales consumidos directamente por el blog.\nbridge_summary:\n  type: pandas.CSVDataset\n  filepath: data/08_reporting/bridge_summary.csv\n\nbridge_chart:\n  type: matplotlib.MatplotlibDataset\n  filepath: assets/bridge_chart.png\n  save_args:\n    dpi: 220\n    bbox_inches: tight\n\nbridge_app_html:\n  type: text.TextDataset\n  filepath: app/bridge.html\n\nmodel_card:\n  type: json.JSONDataset\n  filepath: data/08_reporting/model_card.json\n"}, {"id": "paso-06", "section": "Configuración", "path": "conf/base/logging.yml", "description": "Comportamiento de los registros de ejecución.", "language": "yml", "source": "version: 1\ndisable_existing_loggers: false\nformatters:\n  standard:\n    format: \"%(asctime)s | %(levelname)s | %(name)s | %(message)s\"\nhandlers:\n  console:\n    class: logging.StreamHandler\n    formatter: standard\n    level: INFO\n    stream: ext://sys.stdout\nroot:\n  handlers: [console]\n  level: INFO\n"}, {"id": "paso-07", "section": "Configuración", "path": "conf/test/parameters.yml", "description": "Sobrescrituras de bajo costo para pruebas.", "language": "yml", "source": "bayesian:\n  regular_features:\n    - upstream_available_pct\n    - discharge_sumps_in_range_pct\n    - auxiliary_crushing_available_pct\n    - secondary_grinding_available_pct\n    - penetration_rate_mean\n    - feed_fines_pct_mean\n    - feed_fines_pct_centered_sq\n  prior_std_multiplier: 2.0\n  hac_maxlags: 7\n  zone_scale_prior_tph: 55.0\n  hardness_scale_prior_tph: 45.0\n  cluster_scale_prior_tph: 75.0\n  random_seed: 123\n  sampling:\n    draws: 40\n    tune: 40\n    chains: 1\n    cores: 1\n    target_accept: 0.90\n    progressbar: false\n\nbacktest:\n  start: \"2035-01-01\"\n  end: \"2035-12-31\"\n  rolling_train_months: 12\n  horizon_months: 3\n  step_months: 3\n  min_train_days: 180\n  min_test_days: 15\n  sampling:\n    draws: 30\n    tune: 30\n    chains: 1\n    cores: 1\n    target_accept: 0.90\n    progressbar: false\n"}, {"id": "paso-08", "section": "Datos sintéticos", "path": "scripts/generate_public_synthetic_data.py", "description": "Generador reproducible de los contratos públicos ficticios.", "language": "py", "source": "\"\"\"Genera desde cero los datos públicos del caso didáctico de forecasting.\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nROOT = Path(__file__).parents[1]\nRAW = ROOT / \"data\" / \"01_raw\"\nSEED = 20260814\n\n\ndef _states(rng: np.random.Generator, n: int, availability: float) -> np.ndarray:\n    \"\"\"\n    Crea una señal sintética de disponibilidad con transiciones suaves.\n\n    Parámetros:\n    -------------\n    rng : generador seudoaleatorio independiente usado por el caso público.\n    n : número de observaciones que se desea producir.\n    availability : disponibilidad marginal objetivo entre cero y uno.\n\n    Retorna:\n    ---------\n    np.ndarray : señal normalizada de disponibilidad con longitud ``n``.\n    \"\"\"\n    state = rng.random(n) < availability\n    for index in range(1, n):\n        if rng.random() < 0.94:\n            state[index] = state[index - 1]\n    signal = state.astype(float) + rng.normal(0, 0.012, n)\n    return np.clip(signal, 0, 1)\n\n\ndef generate_geology(rng: np.random.Generator) -> None:\n    \"\"\"\n    Construye composiciones geológicas ficticias sin copiar series históricas.\n\n    Parámetros:\n    -------------\n    rng : generador seudoaleatorio independiente usado por el caso público.\n\n    Retorna:\n    ---------\n    None. La función escribe el contrato geológico diario en ``data/01_raw``.\n    \"\"\"\n    dates = pd.date_range(\"2032-01-01\", \"2035-12-31\", freq=\"D\")\n    n = len(dates)\n    seasonal = 1 + 0.07 * np.sin(np.arange(n) * 2 * np.pi / 181)\n    feed = np.clip(rng.normal(43_000, 5_800, n) * seasonal, 18_000, 62_000)\n    feed[rng.random(n) < 0.018] = 0\n    lithology = rng.dirichlet([2.4, 3.2, 1.7, 2.8, 1.2, 2.0, 1.5], n) * feed[:, None]\n    quality = rng.dirichlet([3.1, 4.0, 2.2], n) * feed[:, None]\n    frame = pd.DataFrame({\"date\": dates})\n    for index, name in enumerate(\"alpha bravo charlie delta echo foxtrot golf\".split()):\n        frame[f\"lithology_{name}\"] = lithology[:, index].round(3)\n    for index, name in enumerate(\"massive jointed brecciated\".split()):\n        frame[f\"quality_{name}\"] = quality[:, index].round(3)\n    frame[\"feed_tonnes\"] = feed.round(3)\n    frame.to_csv(RAW / \"geology_daily.csv\", index=False)\n\n\ndef generate_spatial_data(rng: np.random.Generator) -> None:\n    \"\"\"\n    Genera un marco cartesiano local ficticio y ciclos independientes de una mina real.\n\n    Parámetros:\n    -------------\n    rng : generador seudoaleatorio independiente usado por el caso público.\n\n    Retorna:\n    ---------\n    None. La función escribe el modelo de dureza y los ciclos sintéticos de transporte.\n    \"\"\"\n    source_names = [f\"SOURCE_{letter}\" for letter in \"ABCDEFGH\"]\n    centers = np.array(\n        [\n            [-2100, -900, -180],\n            [-1200, 650, -260],\n            [-300, -1200, -340],\n            [650, 900, -420],\n            [1450, -500, -500],\n            [2200, 750, -580],\n            [-1650, 1450, -300],\n            [1200, 1550, -460],\n        ],\n        dtype=float,\n    )\n\n    block_rows: list[pd.DataFrame] = []\n    for source_index, center in enumerate(centers):\n        n_blocks = 4_000\n        xyz = rng.normal(center, [330, 270, 75], (n_blocks, 3))\n        hardness = np.clip(\n            31 + source_index * 1.6 + 0.004 * xyz[:, 0] - 0.012 * xyz[:, 2]\n            + rng.normal(0, 4.5, n_blocks),\n            12,\n            62,\n        )\n        block_rows.append(\n            pd.DataFrame(\n                {\n                    \"x\": xyz[:, 0].round(3),\n                    \"y\": xyz[:, 1].round(3),\n                    \"z\": xyz[:, 2].round(3),\n                    \"penetration_rate\": hardness.round(4),\n                    \"hardness_class\": pd.cut(\n                        hardness,\n                        bins=[-np.inf, 27, 36, 45, np.inf],\n                        labels=[\"soft\", \"medium\", \"hard\", \"very_hard\"],\n                    ).astype(str),\n                }\n            )\n        )\n    blocks = pd.concat(block_rows, ignore_index=True)\n    blocks.to_parquet(RAW / \"hardness_block_model.parquet\", index=False)\n\n    days = pd.date_range(\"2034-01-01\", \"2035-12-31\", freq=\"D\")\n    n_cycles_by_day = rng.poisson(82, len(days)) + 28\n    n_cycles = int(n_cycles_by_day.sum())\n    day_values = np.repeat(days.to_numpy(), n_cycles_by_day)\n    seconds = rng.integers(0, 86_400, n_cycles)\n    timestamps = pd.to_datetime(day_values) + pd.to_timedelta(seconds, unit=\"s\")\n    source_index = rng.choice(len(source_names), n_cycles, p=[0.17, 0.15, 0.14, 0.13, 0.12, 0.11, 0.10, 0.08])\n    xyz = centers[source_index] + rng.normal(0, [240, 210, 55], (n_cycles, 3))\n    cycles = pd.DataFrame(\n        {\n            \"cycle_timestamp\": timestamps,\n            \"destination\": \"PROCESS_FEED\",\n            \"source_code\": [f\"{source_names[i]}_SECTOR_{rng.integers(1, 7):02d}\" for i in source_index],\n            \"truck_id\": [f\"HAUL_UNIT_{value:03d}\" for value in rng.integers(1, 19, n_cycles)],\n            \"loading_unit_id\": [f\"LOAD_UNIT_{value:03d}\" for value in rng.integers(1, 9, n_cycles)],\n            \"x\": xyz[:, 0].round(3),\n            \"y\": xyz[:, 1].round(3),\n            \"z\": xyz[:, 2].round(3),\n        }\n    ).sort_values(\"cycle_timestamp\", ignore_index=True)\n    cycles.to_parquet(RAW / \"haulage_cycles.parquet\", index=False)\n\n\ndef generate_plant(rng: np.random.Generator) -> None:\n    \"\"\"\n    Simula señales de un circuito didáctico sin reproducir capacidades reales.\n\n    Parámetros:\n    -------------\n    rng : generador seudoaleatorio independiente usado por el caso público.\n\n    Retorna:\n    ---------\n    None. La función escribe las señales horarias ficticias en ``data/01_raw``.\n    \"\"\"\n    timestamps = pd.date_range(\"2034-01-01\", \"2035-12-31 23:00:00\", freq=\"h\")\n    n = len(timestamps)\n    t = np.arange(n)\n    context = 1 + 0.06 * np.sin(2 * np.pi * t / (24 * 73)) + rng.normal(0, 0.045, n)\n    feed_a = np.clip(1_180 * context + rng.normal(0, 105, n), 0, 1_650)\n    feed_b = np.clip(1_050 * context + rng.normal(0, 115, n), 0, 1_580)\n    feed_a[rng.random(n) < 0.025] = 0\n    feed_b[rng.random(n) < 0.031] = 0\n    frame = pd.DataFrame(\n        {\n            \"timestamp\": timestamps,\n            \"line_a_feed_tph\": feed_a,\n            \"line_b_feed_tph\": feed_b,\n            \"line_a_power_kw\": np.clip(2_100 + 3.2 * feed_a + rng.normal(0, 260, n), 80, 8_300),\n            \"line_b_power_kw\": np.clip(2_000 + 3.3 * feed_b + rng.normal(0, 270, n), 80, 8_100),\n            \"intermediate_stockpile_level_m\": np.clip(rng.normal(13.5, 3.2, n), 0, 23),\n            \"line_a_discharge_sump_pct\": np.clip(rng.normal(67, 12, n), 0, 100),\n            \"line_b_discharge_sump_pct\": np.clip(rng.normal(65, 13, n), 0, 100),\n            \"feed_fines_pct\": np.clip(rng.normal(29, 8, n), 2, 68),\n        }\n    )\n    for number, availability in enumerate([0.86, 0.82, 0.79], start=1):\n        frame[f\"auxiliary_crusher_{number}_state\"] = _states(rng, n, availability)\n    for line, availability in ((\"a\", 0.89), (\"b\", 0.87)):\n        for number in range(1, 4):\n            frame[f\"line_{line}_pump_{number}_state\"] = _states(rng, n, availability - 0.025 * number)\n        for number in range(1, 3):\n            frame[f\"line_{line}_ball_mill_{number}_state\"] = _states(rng, n, availability + 0.035)\n    frame.to_parquet(RAW / \"plant_signals_hourly.parquet\", index=False)\n\n\ndef main() -> None:\n    \"\"\"\n    Regenera de forma determinista los cuatro contratos de entrada públicos.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La función materializa los archivos sintéticos en ``data/01_raw``.\n    \"\"\"\n    RAW.mkdir(parents=True, exist_ok=True)\n    rng = np.random.default_rng(SEED)\n    generate_geology(rng)\n    generate_spatial_data(rng)\n    generate_plant(rng)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"id": "paso-09", "section": "Paquete", "path": "src/bayesian_tph_forecasting/__init__.py", "description": "Identidad y versión del paquete.", "language": "py", "source": "\"\"\"\nExpone la versión del paquete y las pipelines Kedro del proyecto de forecasting Bayesiano.\n\"\"\"\n\n__version__ = \"0.1.0\"\n"}, {"id": "paso-10", "section": "Paquete", "path": "src/bayesian_tph_forecasting/__main__.py", "description": "Punto de entrada de la CLI.", "language": "py", "source": "\"\"\"\nProporciona el punto de entrada del paquete compatible con la CLI de Kedro.\n\"\"\"\n\nfrom pathlib import Path\n\nfrom kedro.framework.cli.utils import KedroCliError\nfrom kedro.framework.startup import bootstrap_project\n\n\ndef main() -> None:\n    \"\"\"\n    Inicializa el proyecto desde el directorio de trabajo para delegar su ejecución a Kedro.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La función inicializa el proyecto o levanta ``KedroCliError`` si la ruta no es válida.\n    \"\"\"\n    try:\n        bootstrap_project(Path.cwd())\n    except Exception as exc:  # pragma: no cover - mensaje de conveniencia para CLI\n        raise KedroCliError(\"Ejecuta este comando desde la raíz del proyecto Kedro.\") from exc\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"id": "paso-11", "section": "Paquete", "path": "src/bayesian_tph_forecasting/settings.py", "description": "Carga global de configuración.", "language": "py", "source": "\"\"\"\nDefine el cargador y los ambientes de configuración globales del proyecto Kedro.\n\"\"\"\n\nfrom kedro.config import OmegaConfigLoader\n\nCONFIG_LOADER_CLASS = OmegaConfigLoader\nCONFIG_LOADER_ARGS = {\n    \"base_env\": \"base\",\n    \"default_run_env\": \"local\",\n}\n"}, {"id": "paso-12", "section": "Paquete", "path": "src/bayesian_tph_forecasting/pipelines/__init__.py", "description": "Espacio de nombres de las pipelines modulares.", "language": "py", "source": "\"\"\"\nAgrupa las pipelines modulares que componen el proyecto Kedro.\n\"\"\"\n"}, {"id": "paso-13", "section": "Persistencia", "path": "src/bayesian_tph_forecasting/datasets/__init__.py", "description": "Espacio de nombres de los datasets personalizados.", "language": "py", "source": "\"\"\"\nAgrupa los datasets personalizados que utiliza el catálogo de datos de Kedro.\n\"\"\"\n"}, {"id": "paso-14", "section": "Persistencia", "path": "src/bayesian_tph_forecasting/datasets/inference_data_dataset.py", "description": "Adaptador NetCDF para el posterior de ArviZ.", "language": "py", "source": "\"\"\"\nImplementa un dataset local para persistir objetos ``arviz.InferenceData`` en NetCDF.\n\"\"\"\n\nfrom pathlib import Path\nfrom typing import Any\n\nimport arviz as az\nfrom kedro.io import AbstractDataset\n\n\nclass InferenceDataDataset(AbstractDataset[Any, Any]):\n    \"\"\"\n    Serializa los grupos posteriores de ArviZ sin acoplar la persistencia a un nodo.\n\n    Parámetros:\n    -------------\n    filepath : ruta local del archivo NetCDF que almacena el objeto de inferencia.\n    \"\"\"\n\n    def __init__(self, filepath: str):\n        \"\"\"\n        Inicializa el dataset con la ruta del archivo NetCDF.\n\n        Parámetros:\n        -------------\n        filepath : ruta local del archivo que se leerá o escribirá.\n\n        Retorna:\n        ---------\n        None.\n        \"\"\"\n        self._filepath = Path(filepath)\n\n    def _load(self) -> Any:\n        \"\"\"\n        Carga desde disco el objeto de inferencia serializado.\n\n        Parámetros:\n        -------------\n        No aplica.\n\n        Retorna:\n        ---------\n        Any : objeto ``arviz.InferenceData`` reconstruido desde NetCDF.\n        \"\"\"\n        return az.from_netcdf(self._filepath)\n\n    def _save(self, data: Any) -> None:\n        \"\"\"\n        Guarda un objeto de inferencia en formato NetCDF y crea su directorio si es necesario.\n\n        Parámetros:\n        -------------\n        data : objeto compatible con el método ``to_netcdf`` de ArviZ.\n\n        Retorna:\n        ---------\n        None.\n        \"\"\"\n        self._filepath.parent.mkdir(parents=True, exist_ok=True)\n        data.to_netcdf(self._filepath)\n\n    def _describe(self) -> dict[str, str]:\n        \"\"\"\n        Describe la ubicación configurada para el dataset.\n\n        Parámetros:\n        -------------\n        No aplica.\n\n        Retorna:\n        ---------\n        dict[str, str] : metadatos con la ruta del archivo NetCDF.\n        \"\"\"\n        return {\"filepath\": str(self._filepath)}\n\n    def _exists(self) -> bool:\n        \"\"\"\n        Comprueba si el archivo configurado existe en el sistema local.\n\n        Parámetros:\n        -------------\n        No aplica.\n\n        Retorna:\n        ---------\n        bool : ``True`` cuando el archivo existe y ``False`` en caso contrario.\n        \"\"\"\n        return self._filepath.exists()\n"}, {"id": "paso-15", "section": "Ingeniería de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_engineering/__init__.py", "description": "Interfaz pública de la pipeline de ingeniería de datos.", "language": "py", "source": "\"\"\"\nExpone la construcción de la pipeline dedicada a ingeniería de datos.\n\"\"\"\n\nfrom .pipeline import create_pipeline\n\n__all__ = [\"create_pipeline\"]\n"}, {"id": "paso-16", "section": "Ingeniería de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_engineering/pipeline.py", "description": "Declaración de entradas, nodos y salidas de la primera pipeline.", "language": "py", "source": "\"\"\"\nDefine de forma declarativa la pipeline de ingeniería de datos.\n\"\"\"\n\nfrom kedro.pipeline import Pipeline, node, pipeline\n\nfrom .nodes import (\n    build_daily_plant_tables,\n    build_daily_spatial_context,\n    build_geology_composition,\n    build_training_mine_geometry,\n    clean_plant_signals,\n    enrich_haulage_with_hardness,\n)\n\n\ndef create_pipeline(**kwargs) -> Pipeline:\n    \"\"\"\n    Construye los nodos de limpieza, agregación diaria y contexto espacial de la mina.\n\n    Parámetros:\n    -------------\n    **kwargs : argumentos adicionales reservados por la interfaz de creación de Kedro.\n\n    Retorna:\n    ---------\n    Pipeline : pipeline localizada de ingeniería de datos.\n    \"\"\"\n    return pipeline(\n        [\n            node(\n                clean_plant_signals,\n                \"plant_signals_hourly_raw\",\n                \"plant_signals_hourly_clean\",\n                name=\"clean_plant_signals\",\n                tags=[\"quality\", \"plant\"],\n            ),\n            node(\n                build_daily_plant_tables,\n                [\"plant_signals_hourly_clean\", \"params:plant\"],\n                [\"plant_target_daily\", \"plant_context_daily\"],\n                name=\"aggregate_daily_plant_context\",\n                tags=[\"plant\", \"daily\"],\n            ),\n            node(\n                build_geology_composition,\n                \"geology_daily_raw\",\n                \"geology_composition_daily\",\n                name=\"close_geological_compositions\",\n                tags=[\"geology\", \"quality\"],\n            ),\n            node(\n                enrich_haulage_with_hardness,\n                [\"haulage_cycles_raw\", \"hardness_block_model_raw\", \"params:spatial\"],\n                \"haulage_cycles_with_hardness\",\n                name=\"match_haulage_cycles_to_hardness\",\n                tags=[\"haulage\", \"spatial\"],\n            ),\n            node(\n                build_training_mine_geometry,\n                [\"haulage_cycles_with_hardness\", \"params:spatial\"],\n                [\"mine_zone_components\", \"mine_zone_vertices\"],\n                name=\"learn_training_only_mine_geometry\",\n                tags=[\"spatial\", \"no_leakage\"],\n            ),\n            node(\n                build_daily_spatial_context,\n                [\n                    \"haulage_cycles_with_hardness\",\n                    \"mine_zone_components\",\n                    \"mine_zone_vertices\",\n                ],\n                \"spatial_context_daily\",\n                name=\"aggregate_daily_spatial_context\",\n                tags=[\"spatial\", \"daily\"],\n            ),\n        ],\n        namespace=\"data_engineering\",\n        inputs={\n            \"plant_signals_hourly_raw\",\n            \"geology_daily_raw\",\n            \"haulage_cycles_raw\",\n            \"hardness_block_model_raw\",\n        },\n        outputs={\n            \"plant_signals_hourly_clean\",\n            \"haulage_cycles_with_hardness\",\n            \"mine_zone_components\",\n            \"mine_zone_vertices\",\n            \"plant_target_daily\",\n            \"plant_context_daily\",\n            \"geology_composition_daily\",\n            \"spatial_context_daily\",\n        },\n        parameters={\"params:plant\", \"params:spatial\"},\n    )\n"}, {"id": "paso-17", "section": "Ingeniería de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_engineering/nodes.py", "description": "Limpieza, agregación operacional y contexto espacial.", "language": "py", "source": "\"\"\"\nImplementa nodos puros que convierten extractos estáticos en entidades diarias de negocio.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\n\nimport numpy as np\nimport pandas as pd\nfrom matplotlib.path import Path as PolygonPath\nfrom scipy.spatial import ConvexHull, QhullError, cKDTree\nfrom sklearn.cluster import DBSCAN\n\nPLANT_SIGNAL_COLUMNS = [\n    \"line_a_feed_tph\",\n    \"line_b_feed_tph\",\n    \"line_a_power_kw\",\n    \"line_b_power_kw\",\n    \"intermediate_stockpile_level_m\",\n    \"line_a_discharge_sump_pct\",\n    \"line_b_discharge_sump_pct\",\n    \"feed_fines_pct\",\n    \"auxiliary_crusher_1_state\",\n    \"auxiliary_crusher_2_state\",\n    \"auxiliary_crusher_3_state\",\n    \"line_a_pump_1_state\",\n    \"line_a_pump_2_state\",\n    \"line_a_pump_3_state\",\n    \"line_b_pump_1_state\",\n    \"line_b_pump_2_state\",\n    \"line_b_pump_3_state\",\n    \"line_a_ball_mill_1_state\",\n    \"line_a_ball_mill_2_state\",\n    \"line_b_ball_mill_1_state\",\n    \"line_b_ball_mill_2_state\",\n]\n\n\ndef _require_columns(df: pd.DataFrame, required: list[str], dataset_name: str) -> None:\n    \"\"\"\n    Verifica que un dataframe contenga todas las columnas exigidas por su contrato.\n\n    Parámetros:\n    -------------\n    df : dataframe que se desea validar.\n    required : nombres de las columnas obligatorias.\n    dataset_name : nombre legible del dataset usado en el mensaje de error.\n\n    Retorna:\n    ---------\n    None. La función levanta ``ValueError`` cuando falta alguna columna.\n    \"\"\"\n    missing = sorted(set(required) - set(df.columns))\n    if missing:\n        raise ValueError(f\"{dataset_name} no cumple su contrato; faltan columnas: {missing}\")\n\n\ndef clean_plant_signals(plant_signals_hourly_raw: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Valida tipos, orden temporal y unicidad de las señales horarias de planta.\n\n    Parámetros:\n    -------------\n    plant_signals_hourly_raw : extracto horario sin normalizar de señales de planta.\n\n    Retorna:\n    ---------\n    pd.DataFrame : señales seleccionadas, tipadas, deduplicadas y ordenadas por tiempo.\n    \"\"\"\n    required = [\"timestamp\", *PLANT_SIGNAL_COLUMNS]\n    _require_columns(plant_signals_hourly_raw, required, \"plant_signals_hourly_raw\")\n    df = plant_signals_hourly_raw[required].copy()\n    df[\"timestamp\"] = pd.to_datetime(df[\"timestamp\"], errors=\"raise\")\n    for column in PLANT_SIGNAL_COLUMNS:\n        df[column] = pd.to_numeric(df[column], errors=\"coerce\")\n    return (\n        df.drop_duplicates(\"timestamp\", keep=\"last\").sort_values(\"timestamp\").reset_index(drop=True)\n    )\n\n\ndef build_daily_plant_tables(\n    plant_signals_hourly_clean: pd.DataFrame,\n    plant: dict,\n) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"\n    Construye el objetivo diario y las condiciones contextuales del circuito didáctico.\n\n    Parámetros:\n    -------------\n    plant_signals_hourly_clean : señales horarias limpias de ambas líneas de molienda.\n    plant : umbrales operacionales para estabilidad y disponibilidad de equipos.\n\n    Retorna:\n    ---------\n    tuple[pd.DataFrame, pd.DataFrame] : rendimiento diario y contexto operacional diario.\n    \"\"\"\n    df = plant_signals_hourly_clean.copy()\n    df[\"date\"] = df[\"timestamp\"].dt.normalize()\n    online_threshold = float(plant[\"online_threshold\"])\n\n    line_a_stable = df[\"line_a_feed_tph\"].ge(plant[\"stable_feed_min_tph\"]) & df[\n        \"line_a_power_kw\"\n    ].ge(plant[\"stable_power_min_kw\"])\n    line_b_stable = df[\"line_b_feed_tph\"].ge(plant[\"stable_feed_min_tph\"]) & df[\n        \"line_b_power_kw\"\n    ].ge(plant[\"stable_power_min_kw\"])\n    line_a_daily = df[\"line_a_feed_tph\"].where(line_a_stable).groupby(df[\"date\"]).mean()\n    line_b_daily = df[\"line_b_feed_tph\"].where(line_b_stable).groupby(df[\"date\"]).mean()\n    target_df = pd.concat(\n        [line_a_daily.rename(\"line_a_tph\"), line_b_daily.rename(\"line_b_tph\")], axis=1\n    ).reset_index()\n    target_df[\"plant_total_tph\"] = target_df[\"line_a_tph\"] + target_df[\"line_b_tph\"]\n\n    upstream_available = df[\"intermediate_stockpile_level_m\"].gt(\n        plant[\"intermediate_stockpile_min_m\"]\n    )\n    low_sump, high_sump = plant[\"discharge_sump_range_pct\"]\n    sumps_in_range = df[\"line_a_discharge_sump_pct\"].between(low_sump, high_sump) & df[\n        \"line_b_discharge_sump_pct\"\n    ].between(low_sump, high_sump)\n    auxiliary_crushing_available = (\n        df[[\"auxiliary_crusher_1_state\", \"auxiliary_crusher_2_state\", \"auxiliary_crusher_3_state\"]]\n        .ge(online_threshold)\n        .any(axis=1)\n    )\n\n    phase_availability: list[pd.Series] = []\n    for line in (\"a\", \"b\"):\n        pumps_online = (\n            df[\n                [\n                    f\"line_{line}_pump_1_state\",\n                    f\"line_{line}_pump_2_state\",\n                    f\"line_{line}_pump_3_state\",\n                ]\n            ]\n            .ge(online_threshold)\n            .sum(axis=1)\n        )\n        mills_online = (\n            df[[f\"line_{line}_ball_mill_1_state\", f\"line_{line}_ball_mill_2_state\"]]\n            .ge(online_threshold)\n            .all(axis=1)\n        )\n        phase_availability.append(pumps_online.ge(2) & mills_online)\n    secondary_available = pd.concat(phase_availability, axis=1).mean(axis=1)\n\n    hourly_context = pd.DataFrame(\n        {\n            \"date\": df[\"date\"],\n            \"upstream_available\": upstream_available.astype(float),\n            \"discharge_sumps_in_range\": sumps_in_range.astype(float),\n            \"auxiliary_crushing_available\": auxiliary_crushing_available.astype(float),\n            \"secondary_grinding_available\": secondary_available,\n            \"feed_fines_pct\": df[\"feed_fines_pct\"].where(df[\"feed_fines_pct\"].between(0, 100)),\n        }\n    )\n    context_df = hourly_context.groupby(\"date\", as_index=False).agg(\n        upstream_available_pct=(\"upstream_available\", lambda x: 100 * x.mean()),\n        discharge_sumps_in_range_pct=(\"discharge_sumps_in_range\", lambda x: 100 * x.mean()),\n        auxiliary_crushing_available_pct=(\"auxiliary_crushing_available\", lambda x: 100 * x.mean()),\n        secondary_grinding_available_pct=(\"secondary_grinding_available\", lambda x: 100 * x.mean()),\n        feed_fines_pct_mean=(\"feed_fines_pct\", \"mean\"),\n    )\n    return target_df, context_df\n\n\ndef build_geology_composition(geology_daily_raw: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Convierte tonelajes diarios de litología y calidad en composiciones cerradas.\n\n    Parámetros:\n    -------------\n    geology_daily_raw : tonelajes y variables de calidad informados por día.\n\n    Retorna:\n    ---------\n    pd.DataFrame : proporciones geológicas y de calidad válidas, ordenadas por fecha.\n    \"\"\"\n    df = geology_daily_raw.copy()\n    df[\"date\"] = pd.to_datetime(df[\"date\"], errors=\"raise\").dt.normalize()\n    lithology_cols = sorted(column for column in df if column.startswith(\"lithology_\"))\n    quality_cols = sorted(column for column in df if column.startswith(\"quality_\"))\n    _require_columns(\n        df, [\"date\", \"feed_tonnes\", *lithology_cols, *quality_cols], \"geology_daily_raw\"\n    )\n    denominator = pd.to_numeric(df[\"feed_tonnes\"], errors=\"coerce\").replace(0, np.nan)\n    for column in [*lithology_cols, *quality_cols]:\n        df[column] = pd.to_numeric(df[column], errors=\"coerce\") / denominator\n    return df[[\"date\", *lithology_cols, *quality_cols]].dropna().sort_values(\"date\")\n\n\ndef enrich_haulage_with_hardness(\n    haulage_cycles_raw: pd.DataFrame,\n    hardness_block_model_raw: pd.DataFrame,\n    spatial: dict,\n) -> pd.DataFrame:\n    \"\"\"\n    Asocia cada punto de carguío sintético al bloque de dureza más cercano.\n\n    Parámetros:\n    -------------\n    haulage_cycles_raw : ciclos de transporte con origen, destino y coordenadas de carguío.\n    hardness_block_model_raw : bloques espaciales con penetración y clase de dureza.\n    spatial : tolerancias y parámetros del emparejamiento espacial.\n\n    Retorna:\n    ---------\n    pd.DataFrame : ciclos destinados al chancador primario enriquecidos con dureza y procedencia.\n    \"\"\"\n    cycle_cols = [\n        \"cycle_timestamp\",\n        \"destination\",\n        \"source_code\",\n        \"truck_id\",\n        \"loading_unit_id\",\n        \"x\",\n        \"y\",\n        \"z\",\n    ]\n    block_cols = [\"x\", \"y\", \"z\", \"penetration_rate\", \"hardness_class\"]\n    _require_columns(haulage_cycles_raw, cycle_cols, \"haulage_cycles_raw\")\n    _require_columns(hardness_block_model_raw, block_cols, \"hardness_block_model_raw\")\n\n    cycles = haulage_cycles_raw[cycle_cols].copy()\n    cycles[\"cycle_timestamp\"] = pd.to_datetime(cycles[\"cycle_timestamp\"], errors=\"coerce\")\n    cycles = cycles.loc[cycles[\"destination\"].eq(\"PROCESS_FEED\")].dropna(\n        subset=[\"cycle_timestamp\", \"x\", \"y\", \"z\"]\n    )\n    blocks = hardness_block_model_raw[block_cols].dropna(subset=block_cols).copy()\n    tree = cKDTree(blocks[[\"x\", \"y\", \"z\"]].to_numpy(dtype=float))\n    distance, index = tree.query(cycles[[\"x\", \"y\", \"z\"]].to_numpy(dtype=float), k=1)\n    matched = blocks.iloc[index].reset_index(drop=True)\n    cycles = cycles.reset_index(drop=True)\n    cycles[\"hardness_match_distance_m\"] = distance\n    within_tolerance = cycles[\"hardness_match_distance_m\"].le(\n        spatial[\"max_hardness_match_distance_m\"]\n    )\n    cycles[\"penetration_rate\"] = matched[\"penetration_rate\"].where(within_tolerance)\n    cycles[\"hardness_class\"] = matched[\"hardness_class\"].where(within_tolerance, \"unmatched\")\n    cycles[\"has_hardness_match\"] = within_tolerance\n    cycles[\"date\"] = cycles[\"cycle_timestamp\"].dt.normalize()\n    cycles[\"source_area\"] = cycles[\"source_code\"].map(classify_source_area)\n    return cycles\n\n\ndef classify_source_area(source_code: str) -> str:\n    \"\"\"\n    Reduce un código normalizado de banco o stock a un área estable de procedencia.\n\n    Parámetros:\n    -------------\n    source_code : código original de la fuente de mineral.\n\n    Retorna:\n    ---------\n    str : área reconocida o ``UNCLASSIFIED`` cuando el código no cumple el patrón.\n    \"\"\"\n    value = str(source_code).strip().upper()\n    match = re.match(r\"^(SOURCE_[A-H])\", value)\n    return match.group(1) if match else \"UNCLASSIFIED\"\n\n\ndef _robust_hull(points: np.ndarray, trim_quantile: float) -> np.ndarray | None:\n    \"\"\"\n    Calcula una envolvente convexa robusta después de recortar extremos espaciales.\n\n    Parámetros:\n    -------------\n    points : coordenadas bidimensionales candidatas para la envolvente.\n    trim_quantile : cuantíl simétrico usado para recortar valores extremos.\n\n    Retorna:\n    ---------\n    np.ndarray | None : vértices ordenados de la envolvente o ``None`` si no puede estimarse.\n    \"\"\"\n    points = np.asarray(points, dtype=float)\n    points = points[np.isfinite(points).all(axis=1)]\n    if len(points) < 3:\n        return None\n    if len(points) >= 20:\n        x_low, x_high = np.quantile(points[:, 0], [trim_quantile, 1 - trim_quantile])\n        y_low, y_high = np.quantile(points[:, 1], [trim_quantile, 1 - trim_quantile])\n        trimmed = points[\n            (points[:, 0] >= x_low)\n            & (points[:, 0] <= x_high)\n            & (points[:, 1] >= y_low)\n            & (points[:, 1] <= y_high)\n        ]\n        if len(trimmed) >= 3:\n            points = trimmed\n    try:\n        hull = ConvexHull(points)\n    except QhullError:\n        return None\n    return points[hull.vertices]\n\n\ndef build_training_mine_geometry(\n    haulage_cycles_with_hardness: pd.DataFrame,\n    spatial: dict,\n) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"\n    Aprende zonas con historia previa al período evaluado para evitar fuga espacial.\n\n    Parámetros:\n    -------------\n    haulage_cycles_with_hardness : ciclos enriquecidos con procedencia, dureza y coordenadas.\n    spatial : configuración del período de entrenamiento, clustering y envolventes.\n\n    Retorna:\n    ---------\n    tuple[pd.DataFrame, pd.DataFrame] : componentes espaciales aprendidos y sus vértices.\n    \"\"\"\n    training_end = pd.Timestamp(spatial[\"geometry_training_end\"])\n    points = haulage_cycles_with_hardness.loc[\n        haulage_cycles_with_hardness[\"date\"].le(training_end)\n        & haulage_cycles_with_hardness[\"source_area\"].ne(\"UNCLASSIFIED\")\n    ].copy()\n    grid_m = float(spatial[\"grid_m\"])\n    points[\"x_bin\"] = np.rint(points[\"x\"] / grid_m) * grid_m\n    points[\"y_bin\"] = np.rint(points[\"y\"] / grid_m) * grid_m\n\n    components: list[dict] = []\n    vertices: list[dict] = []\n    component_id = 0\n    for source_area, area_df in points.groupby(\"source_area\", sort=True):\n        bins = area_df.groupby([\"x_bin\", \"y_bin\"], as_index=False).size()\n        if len(bins) >= spatial[\"dbscan_min_samples\"]:\n            bins[\"component\"] = DBSCAN(\n                eps=spatial[\"dbscan_eps_m\"],\n                min_samples=spatial[\"dbscan_min_samples\"],\n            ).fit_predict(bins[[\"x_bin\", \"y_bin\"]])\n        else:\n            bins[\"component\"] = 0\n        component_map = bins.set_index([\"x_bin\", \"y_bin\"])[\"component\"]\n        area_df = area_df.copy()\n        area_df[\"component\"] = list(zip(area_df[\"x_bin\"], area_df[\"y_bin\"], strict=False))\n        area_df[\"component\"] = area_df[\"component\"].map(component_map)\n        area_df = area_df.loc[area_df[\"component\"].ge(0)]\n        support = area_df[\"component\"].value_counts()\n        min_support = max(\n            int(spatial[\"min_cycles_per_component\"]),\n            int(np.ceil(len(area_df) * spatial[\"min_component_share\"])),\n        )\n        valid = support.loc[support.ge(min_support)].index.tolist()\n        if not valid and not support.empty:\n            valid = [support.index[0]]\n\n        for rank, label in enumerate(valid, start=1):\n            component_points = area_df.loc[area_df[\"component\"].eq(label)]\n            hull = _robust_hull(\n                component_points[[\"x\", \"y\"]].to_numpy(),\n                spatial[\"hull_trim_quantile\"],\n            )\n            if hull is None:\n                continue\n            component_id += 1\n            components.append(\n                {\n                    \"component_id\": component_id,\n                    \"source_area\": source_area,\n                    \"component_rank\": rank,\n                    \"n_training_cycles\": len(component_points),\n                    \"z_low\": component_points[\"z\"].quantile(0.05),\n                    \"z_high\": component_points[\"z\"].quantile(0.95),\n                }\n            )\n            vertices.extend(\n                {\n                    \"component_id\": component_id,\n                    \"vertex_order\": order,\n                    \"x\": float(x),\n                    \"y\": float(y),\n                }\n                for order, (x, y) in enumerate(hull, start=1)\n            )\n    return pd.DataFrame(components), pd.DataFrame(vertices)\n\n\ndef build_daily_spatial_context(\n    haulage_cycles_with_hardness: pd.DataFrame,\n    mine_zone_components: pd.DataFrame,\n    mine_zone_vertices: pd.DataFrame,\n) -> pd.DataFrame:\n    \"\"\"\n    Asigna zonas aprendidas a cada ciclo y agrega procedencia y dureza por día.\n\n    Parámetros:\n    -------------\n    haulage_cycles_with_hardness : ciclos enriquecidos que se desea clasificar.\n    mine_zone_components : metadatos de los componentes espaciales aprendidos.\n    mine_zone_vertices : vértices ordenados de los polígonos de cada componente.\n\n    Retorna:\n    ---------\n    pd.DataFrame : soporte diario y composiciones porcentuales de zona y dureza.\n    \"\"\"\n    cycles = haulage_cycles_with_hardness.copy()\n    cycles[\"mine_zone\"] = \"UNASSIGNED\"\n    for component in mine_zone_components.itertuples(index=False):\n        mask = cycles[\"source_area\"].eq(component.source_area)\n        if not mask.any():\n            continue\n        polygon = (\n            mine_zone_vertices.loc[mine_zone_vertices[\"component_id\"].eq(component.component_id)]\n            .sort_values(\"vertex_order\")[[\"x\", \"y\"]]\n            .to_numpy()\n        )\n        inside = PolygonPath(polygon).contains_points(cycles.loc[mask, [\"x\", \"y\"]].to_numpy())\n        indices = cycles.loc[mask].index[inside]\n        cycles.loc[indices, \"mine_zone\"] = (\n            f\"{component.source_area}_ZONE_{int(component.component_rank)}\"\n        )\n    fallback = cycles[\"mine_zone\"].eq(\"UNASSIGNED\") & cycles[\"source_area\"].ne(\"UNCLASSIFIED\")\n    cycles.loc[fallback, \"mine_zone\"] = cycles.loc[fallback, \"source_area\"] + \"_OUTSIDE\"\n\n    daily = cycles.groupby(\"date\", as_index=False).agg(\n        n_feed_cycles=(\"mine_zone\", \"size\"),\n        penetration_rate_mean=(\"penetration_rate\", \"mean\"),\n        hardness_match_pct=(\"has_hardness_match\", lambda x: 100 * x.mean()),\n    )\n    zone_shares = (\n        pd.crosstab(cycles[\"date\"], cycles[\"mine_zone\"], normalize=\"index\")\n        .mul(100)\n        .rename(columns=lambda value: f\"zone_share__{value.lower()}\")\n        .reset_index()\n    )\n    hardness_shares = (\n        pd.crosstab(cycles[\"date\"], cycles[\"hardness_class\"], normalize=\"index\")\n        .mul(100)\n        .rename(columns=lambda value: f\"hardness_share__{str(value).lower()}\")\n        .reset_index()\n    )\n    return daily.merge(zone_shares, on=\"date\", how=\"left\").merge(\n        hardness_shares, on=\"date\", how=\"left\"\n    )\n"}, {"id": "paso-18", "section": "Ciencia de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_science/__init__.py", "description": "Interfaz pública de la pipeline de ciencia de datos.", "language": "py", "source": "\"\"\"\nExpone la construcción de la pipeline dedicada a ciencia de datos.\n\"\"\"\n\nfrom .pipeline import create_pipeline\n\n__all__ = [\"create_pipeline\"]\n"}, {"id": "paso-19", "section": "Ciencia de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_science/pipeline.py", "description": "Declaración de firmas geológicas y contrato modelable.", "language": "py", "source": "\"\"\"\nDefine de forma declarativa la pipeline de ciencia de datos.\n\"\"\"\n\nfrom kedro.pipeline import Pipeline, node, pipeline\n\nfrom .nodes import assemble_model_input, fit_geological_signatures\n\n\ndef create_pipeline(**kwargs) -> Pipeline:\n    \"\"\"\n    Construye los nodos de firmas geológicas y ensamblado del contrato modelable.\n\n    Parámetros:\n    -------------\n    **kwargs : argumentos adicionales reservados por la interfaz de creación de Kedro.\n\n    Retorna:\n    ---------\n    Pipeline : pipeline localizada de ciencia de datos.\n    \"\"\"\n    return pipeline(\n        [\n            node(\n                fit_geological_signatures,\n                [\"geology_composition_daily\", \"params:geology_clustering\"],\n                [\n                    \"geological_signatures_daily\",\n                    \"geological_clustering_artifact\",\n                    \"clustering_diagnostics\",\n                ],\n                name=\"fit_training_only_geological_signatures\",\n                tags=[\"clustering\", \"no_leakage\"],\n            ),\n            node(\n                assemble_model_input,\n                [\n                    \"plant_target_daily\",\n                    \"plant_context_daily\",\n                    \"geological_signatures_daily\",\n                    \"spatial_context_daily\",\n                    \"params:analysis\",\n                    \"params:spatial\",\n                    \"params:bayesian\",\n                ],\n                [\"model_input_daily\", \"model_input_schema\"],\n                name=\"assemble_daily_model_contract\",\n                tags=[\"features\", \"contract\"],\n            ),\n        ],\n        namespace=\"data_science\",\n        inputs={\n            \"geology_composition_daily\",\n            \"plant_target_daily\",\n            \"plant_context_daily\",\n            \"spatial_context_daily\",\n        },\n        outputs={\n            \"geological_signatures_daily\",\n            \"geological_clustering_artifact\",\n            \"clustering_diagnostics\",\n            \"model_input_daily\",\n            \"model_input_schema\",\n        },\n        parameters={\n            \"params:geology_clustering\",\n            \"params:analysis\",\n            \"params:spatial\",\n            \"params:bayesian\",\n        },\n    )\n"}, {"id": "paso-20", "section": "Ciencia de datos", "path": "src/bayesian_tph_forecasting/pipelines/data_science/nodes.py", "description": "Clustering geológico y ensamblado diario de variables.", "language": "py", "source": "\"\"\"\nImplementa los nodos de firmas geológicas y ensamblado de la matriz de modelado.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Any\n\nimport pandas as pd\nfrom sklearn.cluster import KMeans\nfrom sklearn.metrics import silhouette_score\nfrom sklearn.preprocessing import StandardScaler\n\n\ndef fit_geological_signatures(\n    geology_composition_daily: pd.DataFrame,\n    geology_clustering: dict,\n) -> tuple[pd.DataFrame, dict[str, Any], pd.DataFrame]:\n    \"\"\"\n    Selecciona el número de firmas por silueta usando únicamente la historia de entrenamiento.\n\n    Parámetros:\n    -------------\n    geology_composition_daily : composiciones geológicas diarias ordenables por fecha.\n    geology_clustering : configuración temporal y de hiperparámetros para ``KMeans``.\n\n    Retorna:\n    ---------\n    tuple[pd.DataFrame, dict[str, Any], pd.DataFrame] : firmas diarias, artefacto ajustado y\n    diagnóstico de silueta para cada número de clusters evaluado.\n    \"\"\"\n    df = geology_composition_daily.sort_values(\"date\").copy()\n    feature_cols = [column for column in df if column.startswith((\"lithology_\", \"quality_\"))]\n    training_end = pd.Timestamp(geology_clustering[\"training_end\"])\n    train_mask = df[\"date\"].le(training_end)\n    scaler = StandardScaler().fit(df.loc[train_mask, feature_cols])\n    train_scaled = scaler.transform(df.loc[train_mask, feature_cols])\n    full_scaled = scaler.transform(df[feature_cols])\n\n    diagnostics: list[dict[str, float]] = []\n    candidates: dict[int, KMeans] = {}\n    for n_clusters in range(\n        int(geology_clustering[\"min_clusters\"]),\n        int(geology_clustering[\"max_clusters\"]) + 1,\n    ):\n        model = KMeans(\n            n_clusters=n_clusters,\n            random_state=int(geology_clustering[\"random_seed\"]),\n            n_init=20,\n            max_iter=400,\n        )\n        labels = model.fit_predict(train_scaled)\n        score = float(silhouette_score(train_scaled, labels))\n        diagnostics.append({\"n_clusters\": n_clusters, \"silhouette_score\": score})\n        candidates[n_clusters] = model\n\n    diagnostics_df = pd.DataFrame(diagnostics).sort_values(\"n_clusters\")\n    best_k = int(diagnostics_df.loc[diagnostics_df[\"silhouette_score\"].idxmax(), \"n_clusters\"])\n    best_model = candidates[best_k]\n    signature_df = df[[\"date\"]].copy()\n    signature_df[\"geological_signature\"] = [\n        f\"SIGNATURE_{label + 1:02d}\" for label in best_model.predict(full_scaled)\n    ]\n    artifact = {\n        \"feature_columns\": feature_cols,\n        \"training_end\": str(training_end.date()),\n        \"best_k\": best_k,\n        \"scaler\": scaler,\n        \"model\": best_model,\n    }\n    return signature_df, artifact, diagnostics_df\n\n\ndef assemble_model_input(\n    plant_target_daily: pd.DataFrame,\n    plant_context_daily: pd.DataFrame,\n    geological_signatures_daily: pd.DataFrame,\n    spatial_context_daily: pd.DataFrame,\n    analysis: dict,\n    spatial: dict,\n    bayesian: dict,\n) -> tuple[pd.DataFrame, dict[str, Any]]:\n    \"\"\"\n    Construye el contrato diario que separa variables, objetivo y metadatos temporales.\n\n    Parámetros:\n    -------------\n    plant_target_daily : rendimiento diario observado de la planta.\n    plant_context_daily : condiciones operacionales agregadas por día.\n    geological_signatures_daily : firma geológica asignada a cada fecha.\n    spatial_context_daily : procedencias y dureza agregadas por día.\n    analysis : límites temporales del análisis y de la evaluación.\n    spatial : umbrales mínimos de soporte espacial.\n    bayesian : configuración de las variables regulares del modelo.\n\n    Retorna:\n    ---------\n    tuple[pd.DataFrame, dict[str, Any]] : matriz diaria modelable y descripción de su esquema.\n    \"\"\"\n    df = (\n        plant_target_daily.merge(plant_context_daily, on=\"date\", how=\"inner\")\n        .merge(geological_signatures_daily, on=\"date\", how=\"inner\")\n        .merge(spatial_context_daily, on=\"date\", how=\"inner\")\n        .sort_values(\"date\")\n        .reset_index(drop=True)\n    )\n    share_cols = sorted(\n        column\n        for column in df\n        if column.startswith(\"zone_share__\") or column.startswith(\"hardness_share__\")\n    )\n    df[share_cols] = df[share_cols].fillna(0.0)\n    training_end = pd.Timestamp(analysis[\"training_end\"])\n    fines_center = float(df.loc[df[\"date\"].le(training_end), \"feed_fines_pct_mean\"].mean())\n    df[\"feed_fines_pct_centered_sq\"] = (df[\"feed_fines_pct_mean\"] - fines_center) ** 2\n\n    required = [\n        \"plant_total_tph\",\n        \"geological_signature\",\n        \"n_feed_cycles\",\n        *bayesian[\"regular_features\"],\n    ]\n    df = (\n        df.dropna(subset=required)\n        .loc[lambda frame: frame[\"n_feed_cycles\"].ge(spatial[\"min_cycles_per_day\"])]\n        .loc[lambda frame: frame[\"date\"].le(pd.Timestamp(analysis[\"evaluation_end\"]))]\n        .reset_index(drop=True)\n    )\n    schema = {\n        \"grain\": \"one row per calendar day\",\n        \"target\": \"plant_total_tph\",\n        \"signature\": \"geological_signature\",\n        \"regular_features\": list(bayesian[\"regular_features\"]),\n        \"zone_share_features\": [\n            column for column in share_cols if column.startswith(\"zone_share__\")\n        ],\n        \"hardness_share_features\": [\n            column for column in share_cols if column.startswith(\"hardness_share__\")\n        ],\n        \"support_only\": [\"n_feed_cycles\", \"hardness_match_pct\"],\n        \"fines_center_training_only\": fines_center,\n        \"date_min\": str(df[\"date\"].min().date()),\n        \"date_max\": str(df[\"date\"].max().date()),\n        \"n_rows\": int(len(df)),\n    }\n    return df, schema\n"}, {"id": "paso-21", "section": "Inferencia Bayesiana", "path": "src/bayesian_tph_forecasting/pipelines/bayesian_inference/__init__.py", "description": "Interfaz pública de la pipeline de inferencia Bayesiana.", "language": "py", "source": "\"\"\"\nExpone la construcción de la pipeline dedicada a inferencia Bayesiana.\n\"\"\"\n\nfrom .pipeline import create_pipeline\n\n__all__ = [\"create_pipeline\"]\n"}, {"id": "paso-22", "section": "Inferencia Bayesiana", "path": "src/bayesian_tph_forecasting/pipelines/bayesian_inference/pipeline.py", "description": "Declaración del backtesting y del ajuste final.", "language": "py", "source": "\"\"\"\nDefine de forma declarativa la pipeline de inferencia Bayesiana.\n\"\"\"\n\nfrom kedro.pipeline import Pipeline, node, pipeline\n\nfrom .nodes import fit_final_model, run_rolling_backtest\n\n\ndef create_pipeline(**kwargs) -> Pipeline:\n    \"\"\"\n    Construye los nodos de backtesting móvil y ajuste final del modelo jerárquico.\n\n    Parámetros:\n    -------------\n    **kwargs : argumentos adicionales reservados por la interfaz de creación de Kedro.\n\n    Retorna:\n    ---------\n    Pipeline : pipeline localizada de inferencia Bayesiana.\n    \"\"\"\n    return pipeline(\n        [\n            node(\n                run_rolling_backtest,\n                [\n                    \"model_input_daily\",\n                    \"params:bayesian\",\n                    \"params:features\",\n                    \"params:backtest\",\n                ],\n                [\"backtest_predictions\", \"backtest_fold_metrics\", \"backtest_summary\"],\n                name=\"run_rolling_twelve_month_backtest\",\n                tags=[\"backtest\", \"rolling\"],\n            ),\n            node(\n                fit_final_model,\n                [\"model_input_daily\", \"params:bayesian\", \"params:features\"],\n                [\"final_inference_data\", \"posterior_parameter_summary\"],\n                name=\"fit_final_identifiable_hierarchical_model\",\n                tags=[\"bayesian\", \"final_model\"],\n            ),\n        ],\n        namespace=\"bayesian_inference\",\n        inputs={\"model_input_daily\"},\n        outputs={\n            \"backtest_predictions\",\n            \"backtest_fold_metrics\",\n            \"backtest_summary\",\n            \"final_inference_data\",\n            \"posterior_parameter_summary\",\n        },\n        parameters={\"params:bayesian\", \"params:features\", \"params:backtest\"},\n    )\n"}, {"id": "paso-23", "section": "Inferencia Bayesiana", "path": "src/bayesian_tph_forecasting/pipelines/bayesian_inference/nodes.py", "description": "Modelo jerárquico, posterior predictivo y validación móvil.", "language": "py", "source": "\"\"\"\nImplementa el modelo jerárquico, el posterior predictivo y el backtesting temporal móvil.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Any\n\nimport arviz as az\nimport numpy as np\nimport pandas as pd\nimport pymc as pm\nimport pytensor.tensor as pt\nimport statsmodels.api as sm\nfrom sklearn.metrics import mean_absolute_error, mean_squared_error\n\n\n@dataclass\nclass StandardizedFamily:\n    \"\"\"\n    Conserva matrices estandarizadas y la transformación ajustada solo en entrenamiento.\n\n    Parámetros:\n    -------------\n    train : matriz estandarizada del período de entrenamiento.\n    prediction : matriz estandarizada del período que se desea predecir.\n    mean : medias de entrenamiento usadas para centrar las variables.\n    std : desviaciones de entrenamiento usadas para escalar las variables.\n    \"\"\"\n\n    train: np.ndarray\n    prediction: np.ndarray\n    mean: pd.Series\n    std: pd.Series\n\n\ndef _standardize(train: pd.DataFrame, prediction: pd.DataFrame) -> StandardizedFamily:\n    \"\"\"\n    Estandariza entrenamiento y predicción con estadísticas calculadas solo en entrenamiento.\n\n    Parámetros:\n    -------------\n    train : variables del período de ajuste.\n    prediction : variables del período que se desea transformar.\n\n    Retorna:\n    ---------\n    StandardizedFamily : matrices transformadas junto con sus medias y desviaciones.\n    \"\"\"\n    mean = train.mean(axis=0)\n    std = train.std(axis=0).replace(0, 1.0).fillna(1.0)\n    return StandardizedFamily(\n        train=((train - mean) / std).to_numpy(dtype=float),\n        prediction=((prediction - mean) / std).to_numpy(dtype=float),\n        mean=mean,\n        std=std,\n    )\n\n\ndef _select_compositional_features(\n    train_df: pd.DataFrame,\n    prefix: str,\n    min_mean_share_pct: float,\n    preferred_reference: str | None = None,\n    excluded_suffix: str | None = None,\n) -> tuple[list[str], str]:\n    \"\"\"\n    Selecciona componentes composicionales con soporte suficiente y fija una referencia.\n\n    Parámetros:\n    -------------\n    train_df : matriz diaria disponible durante el entrenamiento.\n    prefix : prefijo que identifica la familia composicional.\n    min_mean_share_pct : participación media mínima exigida para conservar un componente.\n    preferred_reference : componente de referencia preferido cuando está disponible.\n    excluded_suffix : sufijo opcional que excluye componentes de la selección.\n\n    Retorna:\n    ---------\n    tuple[list[str], str] : componentes seleccionados y nombre de la referencia.\n    \"\"\"\n    candidates = sorted(column for column in train_df if column.startswith(prefix))\n    if not candidates:\n        raise ValueError(f\"No existen columnas composicionales con prefijo {prefix!r}.\")\n    mean_share = train_df[candidates].mean().sort_values(ascending=False)\n    reference = (\n        preferred_reference if preferred_reference in candidates else str(mean_share.index[0])\n    )\n    selected = [\n        column\n        for column, share in mean_share.items()\n        if share >= min_mean_share_pct\n        and column != reference\n        and (excluded_suffix is None or not column.endswith(excluded_suffix))\n    ]\n    return selected, reference\n\n\ndef _empirical_regular_priors(\n    y_train: np.ndarray,\n    regular: StandardizedFamily,\n    zone: StandardizedFamily,\n    hardness: StandardizedFamily,\n    regular_features: list[str],\n    zone_features: list[str],\n    hardness_features: list[str],\n    signatures: pd.Series,\n    hac_maxlags: int,\n    prior_std_multiplier: float,\n) -> tuple[np.ndarray, np.ndarray, float]:\n    \"\"\"\n    Deriva priors regulares desde un modelo OLS completo con errores HAC.\n\n    Parámetros:\n    -------------\n    y_train : rendimiento observado durante el entrenamiento.\n    regular : familia estandarizada de variables operacionales regulares.\n    zone : familia estandarizada de composiciones de procedencia.\n    hardness : familia estandarizada de composiciones de dureza.\n    regular_features : nombres de las variables operacionales regulares.\n    zone_features : nombres de las composiciones de procedencia.\n    hardness_features : nombres de las composiciones de dureza.\n    signatures : firmas geológicas observadas durante el entrenamiento.\n    hac_maxlags : rezago máximo usado por la covarianza HAC.\n    prior_std_multiplier : multiplicador aplicado al error robusto de cada coeficiente.\n\n    Retorna:\n    ---------\n    tuple[np.ndarray, np.ndarray, float] : medias y desviaciones de los priors, más la\n    desviación residual estimada por OLS.\n    \"\"\"\n    frames = [pd.DataFrame(regular.train, columns=regular_features)]\n    if zone_features:\n        frames.append(pd.DataFrame(zone.train, columns=zone_features))\n    if hardness_features:\n        frames.append(pd.DataFrame(hardness.train, columns=hardness_features))\n    frames.append(\n        pd.get_dummies(\n            signatures.reset_index(drop=True), prefix=\"signature\", drop_first=True, dtype=float\n        )\n    )\n    design = sm.add_constant(pd.concat(frames, axis=1), has_constant=\"add\")\n    ols = sm.OLS(y_train, design).fit()\n    robust = ols.get_robustcov_results(cov_type=\"HAC\", maxlags=hac_maxlags)\n    robust_lookup = pd.Series(robust.bse, index=ols.params.index)\n    prior_mean = ols.params.reindex(regular_features).fillna(0.0).to_numpy(dtype=float)\n    prior_std = prior_std_multiplier * robust_lookup.reindex(regular_features).fillna(\n        100.0\n    ).to_numpy(dtype=float)\n    prior_std = np.maximum(\n        np.where(np.isfinite(prior_std) & (prior_std > 0), prior_std, 100.0),\n        1.0,\n    )\n    sigma_hat = float(np.sqrt(ols.mse_resid))\n    return prior_mean, prior_std, sigma_hat\n\n\ndef _posterior_matrix(idata: Any, variable: str, dimension: str) -> np.ndarray:\n    \"\"\"\n    Reordena una variable posterior como una matriz de dimensión por muestra.\n\n    Parámetros:\n    -------------\n    idata : objeto de inferencia que contiene las cadenas posteriores.\n    variable : nombre de la variable posterior que se desea extraer.\n    dimension : dimensión de coordenadas que debe ocupar las filas.\n\n    Retorna:\n    ---------\n    np.ndarray : matriz con la dimensión solicitada en filas y las muestras en columnas.\n    \"\"\"\n    return (\n        idata.posterior[variable]\n        .stack(sample=(\"chain\", \"draw\"))\n        .transpose(dimension, \"sample\")\n        .to_numpy()\n    )\n\n\ndef fit_hierarchical_model(\n    train_df: pd.DataFrame,\n    prediction_df: pd.DataFrame,\n    bayesian: dict,\n    features: dict,\n    sampling: dict,\n    random_seed: int,\n) -> tuple[Any, pd.DataFrame, dict[str, Any]]:\n    \"\"\"\n    Ajusta una especificación jerárquica identificable y predice media y observación futura.\n\n    Parámetros:\n    -------------\n    train_df : observaciones diarias usadas para ajustar el modelo.\n    prediction_df : observaciones cuyo rendimiento se desea explicar o predecir.\n    bayesian : variables, escalas de priors y configuración general del modelo.\n    features : umbrales para seleccionar composiciones de procedencia y dureza.\n    sampling : argumentos entregados a ``pymc.sample``.\n    random_seed : semilla que controla muestreo y simulación posterior predictiva.\n\n    Retorna:\n    ---------\n    tuple[Any, pd.DataFrame, dict[str, Any]] : inferencia posterior, predicciones con\n    contribuciones y metadatos de la especificación ajustada.\n    \"\"\"\n    train_df = train_df.sort_values(\"date\").reset_index(drop=True)\n    prediction_df = prediction_df.sort_values(\"date\").reset_index(drop=True)\n    regular_features = list(bayesian[\"regular_features\"])\n    zone_features, zone_reference = _select_compositional_features(\n        train_df,\n        \"zone_share__\",\n        features[\"min_zone_mean_share_pct\"],\n    )\n    hardness_features, hardness_reference = _select_compositional_features(\n        train_df,\n        \"hardness_share__\",\n        features[\"min_hardness_mean_share_pct\"],\n        preferred_reference=features[\"hardness_reference\"],\n        excluded_suffix=\"unmatched\",\n    )\n\n    regular = _standardize(\n        train_df[regular_features].astype(float), prediction_df[regular_features].astype(float)\n    )\n    zone = _standardize(\n        train_df[zone_features].astype(float), prediction_df[zone_features].astype(float)\n    )\n    hardness = _standardize(\n        train_df[hardness_features].astype(float), prediction_df[hardness_features].astype(float)\n    )\n\n    signature_categories = pd.Index(\n        sorted(\n            pd.concat(\n                [train_df[\"geological_signature\"], prediction_df[\"geological_signature\"]],\n                ignore_index=True,\n            ).unique()\n        ),\n        name=\"signature\",\n    )\n    signature_lookup = {value: index for index, value in enumerate(signature_categories)}\n    train_signature_index = (\n        train_df[\"geological_signature\"].map(signature_lookup).to_numpy(dtype=int)\n    )\n    prediction_signature_index = (\n        prediction_df[\"geological_signature\"].map(signature_lookup).to_numpy(dtype=int)\n    )\n    y_train = train_df[\"plant_total_tph\"].to_numpy(dtype=float)\n\n    regular_prior_mean, regular_prior_std, sigma_hat = _empirical_regular_priors(\n        y_train=y_train,\n        regular=regular,\n        zone=zone,\n        hardness=hardness,\n        regular_features=regular_features,\n        zone_features=zone_features,\n        hardness_features=hardness_features,\n        signatures=train_df[\"geological_signature\"],\n        hac_maxlags=int(bayesian[\"hac_maxlags\"]),\n        prior_std_multiplier=float(bayesian[\"prior_std_multiplier\"]),\n    )\n\n    coords = {\n        \"regular_feature\": regular_features,\n        \"zone_feature\": zone_features,\n        \"hardness_feature\": hardness_features,\n        \"signature\": signature_categories.tolist(),\n        \"obs_train\": np.arange(len(train_df)),\n        \"obs_prediction\": np.arange(len(prediction_df)),\n    }\n    with pm.Model(coords=coords):\n        regular_train_data = pm.Data(\n            \"regular_train\", regular.train, dims=(\"obs_train\", \"regular_feature\")\n        )\n        regular_prediction_data = pm.Data(\n            \"regular_prediction\", regular.prediction, dims=(\"obs_prediction\", \"regular_feature\")\n        )\n        zone_train_data = pm.Data(\"zone_train\", zone.train, dims=(\"obs_train\", \"zone_feature\"))\n        zone_prediction_data = pm.Data(\n            \"zone_prediction\", zone.prediction, dims=(\"obs_prediction\", \"zone_feature\")\n        )\n        hardness_train_data = pm.Data(\n            \"hardness_train\", hardness.train, dims=(\"obs_train\", \"hardness_feature\")\n        )\n        hardness_prediction_data = pm.Data(\n            \"hardness_prediction\", hardness.prediction, dims=(\"obs_prediction\", \"hardness_feature\")\n        )\n        train_signature_data = pm.Data(\n            \"train_signature_index\", train_signature_index, dims=\"obs_train\"\n        )\n        prediction_signature_data = pm.Data(\n            \"prediction_signature_index\", prediction_signature_index, dims=\"obs_prediction\"\n        )\n\n        alpha = pm.Normal(\n            \"alpha\", mu=float(y_train.mean()), sigma=float(max(y_train.std(), sigma_hat))\n        )\n        beta_regular = pm.Normal(\n            \"beta_regular\",\n            mu=regular_prior_mean,\n            sigma=regular_prior_std,\n            dims=\"regular_feature\",\n        )\n        sigma_zone = pm.HalfNormal(\"sigma_zone\", sigma=bayesian[\"zone_scale_prior_tph\"])\n        beta_zone = pm.Deterministic(\n            \"beta_zone\",\n            pm.Normal(\"zone_offset\", 0.0, 1.0, dims=\"zone_feature\") * sigma_zone,\n            dims=\"zone_feature\",\n        )\n        sigma_hardness = pm.HalfNormal(\"sigma_hardness\", sigma=bayesian[\"hardness_scale_prior_tph\"])\n        beta_hardness = pm.Deterministic(\n            \"beta_hardness\",\n            pm.Normal(\"hardness_offset\", 0.0, 1.0, dims=\"hardness_feature\") * sigma_hardness,\n            dims=\"hardness_feature\",\n        )\n        sigma_signature = pm.HalfNormal(\n            \"sigma_signature\", sigma=bayesian[\"cluster_scale_prior_tph\"]\n        )\n        signature_raw = pm.Normal(\"signature_raw\", 0.0, 1.0, dims=\"signature\")\n        signature_effect = pm.Deterministic(\n            \"signature_effect\",\n            (signature_raw - pt.mean(signature_raw)) * sigma_signature,\n            dims=\"signature\",\n        )\n        sigma_observation = pm.HalfNormal(\"sigma_observation\", sigma=max(sigma_hat, 1.0))\n\n        mu_train = alpha + pm.math.dot(regular_train_data, beta_regular)\n        mu_prediction = alpha + pm.math.dot(regular_prediction_data, beta_regular)\n        if zone_features:\n            mu_train = mu_train + pm.math.dot(zone_train_data, beta_zone)\n            mu_prediction = mu_prediction + pm.math.dot(zone_prediction_data, beta_zone)\n        if hardness_features:\n            mu_train = mu_train + pm.math.dot(hardness_train_data, beta_hardness)\n            mu_prediction = mu_prediction + pm.math.dot(hardness_prediction_data, beta_hardness)\n        mu_train = pm.Deterministic(\n            \"mu_train\", mu_train + signature_effect[train_signature_data], dims=\"obs_train\"\n        )\n        pm.Deterministic(\n            \"mu_prediction\",\n            mu_prediction + signature_effect[prediction_signature_data],\n            dims=\"obs_prediction\",\n        )\n        pm.Normal(\n            \"observed_tph\", mu=mu_train, sigma=sigma_observation, observed=y_train, dims=\"obs_train\"\n        )\n        idata = pm.sample(\n            **sampling,\n            random_seed=random_seed,\n            return_inferencedata=True,\n        )\n\n    mu_draws = _posterior_matrix(idata, \"m
