u_prediction\", \"obs_prediction\")\n    sigma_draws = np.asarray(idata.posterior[\"sigma_observation\"]).reshape(-1)\n    rng = np.random.default_rng(random_seed + 10_000)\n    predictive_draws = mu_draws + rng.normal(size=mu_draws.shape) * sigma_draws[None, :]\n    mu_quantiles = np.quantile(mu_draws, [0.05, 0.5, 0.95], axis=1)\n    predictive_quantiles = np.quantile(predictive_draws, [0.05, 0.5, 0.95], axis=1)\n\n    beta_regular_draws = _posterior_matrix(idata, \"beta_regular\", \"regular_feature\")\n    signature_draws = _posterior_matrix(idata, \"signature_effect\", \"signature\")\n    beta_zone_draws = _posterior_matrix(idata, \"beta_zone\", \"zone_feature\")\n    beta_hardness_draws = _posterior_matrix(idata, \"beta_hardness\", \"hardness_feature\")\n    alpha_mean = float(np.asarray(idata.posterior[\"alpha\"]).mean())\n\n    prediction = prediction_df[[\"date\", \"plant_total_tph\", \"geological_signature\"]].copy()\n    prediction[\"y_true\"] = prediction[\"plant_total_tph\"]\n    prediction[\"y_pred_mean\"] = mu_draws.mean(axis=1)\n    prediction[\"mean_p05\"] = mu_quantiles[0]\n    prediction[\"mean_p50\"] = mu_quantiles[1]\n    prediction[\"mean_p95\"] = mu_quantiles[2]\n    prediction[\"predictive_p05\"] = predictive_quantiles[0]\n    prediction[\"predictive_p50\"] = predictive_quantiles[1]\n    prediction[\"predictive_p95\"] = predictive_quantiles[2]\n    prediction[\"base_component\"] = alpha_mean\n    prediction[\"contrib_geology\"] = signature_draws[prediction_signature_index].mean(axis=1)\n    for index, feature in enumerate(regular_features):\n        prediction[f\"contrib__{feature}\"] = (\n            regular.prediction[:, index, None] * beta_regular_draws[index][None, :]\n        ).mean(axis=1)\n    prediction[\"contrib_source\"] = (\n        (zone.prediction @ beta_zone_draws).mean(axis=1) if zone_features else 0.0\n    )\n    prediction[\"contrib_hardness_mix\"] = (\n        (hardness.prediction @ beta_hardness_draws).mean(axis=1) if hardness_features else 0.0\n    )\n    prediction[\"residual_actual_minus_model\"] = prediction[\"y_true\"] - prediction[\"y_pred_mean\"]\n\n    metadata = {\n        \"regular_features\": regular_features,\n        \"zone_features\": zone_features,\n        \"hardness_features\": hardness_features,\n        \"zone_reference\": zone_reference,\n        \"hardness_reference\": hardness_reference,\n        \"signature_categories\": signature_categories.tolist(),\n        \"n_divergences\": int(idata.sample_stats[\"diverging\"].sum().values),\n    }\n    return idata, prediction, metadata\n\n\ndef _metrics(prediction: pd.DataFrame) -> dict[str, float]:\n    \"\"\"\n    Calcula métricas puntuales y coberturas de intervalos para un conjunto de predicciones.\n\n    Parámetros:\n    -------------\n    prediction : valores observados, predichos e intervalos posteriores por día.\n\n    Retorna:\n    ---------\n    dict[str, float] : tamaño de muestra, errores, sesgo y coberturas de intervalos al 90 %.\n    \"\"\"\n    y_true = prediction[\"y_true\"].to_numpy()\n    y_pred = prediction[\"y_pred_mean\"].to_numpy()\n    return {\n        \"n_days\": len(prediction),\n        \"rmse\": float(np.sqrt(mean_squared_error(y_true, y_pred))),\n        \"mae\": float(mean_absolute_error(y_true, y_pred)),\n        \"bias_pred_minus_actual\": float(np.mean(y_pred - y_true)),\n        \"mean_interval_90_coverage_pct\": float(\n            100 * ((y_true >= prediction[\"mean_p05\"]) & (y_true <= prediction[\"mean_p95\"])).mean()\n        ),\n        \"predictive_interval_90_coverage_pct\": float(\n            100\n            * (\n                (y_true >= prediction[\"predictive_p05\"]) & (y_true <= prediction[\"predictive_p95\"])\n            ).mean()\n        ),\n    }\n\n\ndef run_rolling_backtest(\n    model_input_daily: pd.DataFrame,\n    bayesian: dict,\n    features: dict,\n    backtest: dict,\n) -> tuple[pd.DataFrame, pd.DataFrame, pd.DataFrame]:\n    \"\"\"\n    Ejecuta la política de ventana móvil seleccionada y concatena sus resultados fuera de muestra.\n\n    Parámetros:\n    -------------\n    model_input_daily : contrato diario completo ordenable por fecha.\n    bayesian : configuración del modelo y semilla base.\n    features : umbrales de selección de familias composicionales.\n    backtest : ventanas, horizonte, soportes mínimos y configuración de muestreo.\n\n    Retorna:\n    ---------\n    tuple[pd.DataFrame, pd.DataFrame, pd.DataFrame] : predicciones diarias, métricas por fold\n    y resumen agregado de la política móvil.\n    \"\"\"\n    df = model_input_daily.copy()\n    df[\"date\"] = pd.to_datetime(df[\"date\"])\n    start = pd.Timestamp(backtest[\"start\"])\n    end = min(pd.Timestamp(backtest[\"end\"]), df[\"date\"].max() + pd.Timedelta(days=1))\n    fold_starts = pd.date_range(\n        start, end - pd.Timedelta(days=1), freq=f\"{backtest['step_months']}MS\"\n    )\n    predictions: list[pd.DataFrame] = []\n    metrics: list[dict[str, Any]] = []\n\n    for fold_id, fold_start in enumerate(fold_starts, start=1):\n        fold_end = min(fold_start + pd.DateOffset(months=backtest[\"horizon_months\"]), end)\n        train_start = fold_start - pd.DateOffset(months=backtest[\"rolling_train_months\"])\n        train = df.loc[df[\"date\"].ge(train_start) & df[\"date\"].lt(fold_start)].copy()\n        test = df.loc[df[\"date\"].ge(fold_start) & df[\"date\"].lt(fold_end)].copy()\n        if len(train) < backtest[\"min_train_days\"] or len(test) < backtest[\"min_test_days\"]:\n            continue\n        idata, fold_prediction, metadata = fit_hierarchical_model(\n            train,\n            test,\n            bayesian=bayesian,\n            features=features,\n            sampling=backtest[\"sampling\"],\n            random_seed=int(bayesian[\"random_seed\"]) + fold_id,\n        )\n        fold_prediction[\"fold_id\"] = fold_id\n        fold_prediction[\"fold_start\"] = fold_start\n        fold_prediction[\"fold_end\"] = fold_end\n        fold_prediction[\"train_start\"] = train[\"date\"].min()\n        fold_prediction[\"train_end\"] = train[\"date\"].max()\n        predictions.append(fold_prediction)\n        metrics.append(\n            {\n                \"fold_id\": fold_id,\n                \"fold_start\": fold_start,\n                \"fold_end\": fold_end,\n                \"train_start\": train[\"date\"].min(),\n                \"train_end\": train[\"date\"].max(),\n                \"n_train\": len(train),\n                \"n_test\": len(test),\n                \"n_zone_features\": len(metadata[\"zone_features\"]),\n                \"n_hardness_features\": len(metadata[\"hardness_features\"]),\n                \"n_divergences\": metadata[\"n_divergences\"],\n                **_metrics(fold_prediction),\n            }\n        )\n        del idata\n\n    if not predictions:\n        raise ValueError(\"La configuración temporal no produjo folds válidos.\")\n    prediction_df = pd.concat(predictions, ignore_index=True)\n    fold_metrics_df = pd.DataFrame(metrics)\n    summary_df = pd.DataFrame([{\"policy\": \"rolling_12m\", **_metrics(prediction_df)}])\n    summary_df[\"n_divergences\"] = int(fold_metrics_df[\"n_divergences\"].sum())\n    return prediction_df, fold_metrics_df, summary_df\n\n\ndef fit_final_model(\n    model_input_daily: pd.DataFrame,\n    bayesian: dict,\n    features: dict,\n) -> tuple[Any, pd.DataFrame]:\n    \"\"\"\n    Ajusta el posterior final sobre todo el historial publicado.\n\n    Parámetros:\n    -------------\n    model_input_daily : contrato diario completo usado para el ajuste final.\n    bayesian : variables, priors, muestreo y semilla del modelo.\n    features : umbrales de selección de composiciones de procedencia y dureza.\n\n    Retorna:\n    ---------\n    tuple[Any, pd.DataFrame] : objeto de inferencia final y resumen tabular de parámetros.\n    \"\"\"\n    idata, _, _ = fit_hierarchical_model(\n        model_input_daily,\n        model_input_daily,\n        bayesian=bayesian,\n        features=features,\n        sampling=bayesian[\"sampling\"],\n        random_seed=int(bayesian[\"random_seed\"]),\n    )\n    summary = az.summary(\n        idata,\n        var_names=[\n            \"alpha\",\n            \"beta_regular\",\n            \"beta_zone\",\n            \"beta_hardness\",\n            \"signature_effect\",\n            \"sigma_observation\",\n        ],\n        hdi_prob=0.90,\n    ).reset_index(names=\"parameter\")\n    return idata, summary\n"}, {"id": "paso-24", "section": "Reporting", "path": "src/bayesian_tph_forecasting/pipelines/reporting/__init__.py", "description": "Interfaz pública de la pipeline de reporting.", "language": "py", "source": "\"\"\"\nExpone la construcción de la pipeline de reporting y de la aplicación web.\n\"\"\"\n\nfrom .pipeline import create_pipeline\n\n__all__ = [\"create_pipeline\"]\n"}, {"id": "paso-25", "section": "Reporting", "path": "src/bayesian_tph_forecasting/pipelines/reporting/pipeline.py", "description": "Declaración de los productos que consumirá el blog.", "language": "py", "source": "\"\"\"\nDefine de forma declarativa la pipeline que materializa los productos finales.\n\"\"\"\n\nfrom kedro.pipeline import Pipeline, node, pipeline\n\nfrom .nodes import (\n    build_bridge_app,\n    build_bridge_summary,\n    build_model_card,\n    plot_bridge_chart,\n)\n\n\ndef create_pipeline(**kwargs) -> Pipeline:\n    \"\"\"\n    Construye los nodos del bridge, la aplicación interactiva y la ficha del modelo.\n\n    Parámetros:\n    -------------\n    **kwargs : argumentos adicionales reservados por la interfaz de creación de Kedro.\n\n    Retorna:\n    ---------\n    Pipeline : pipeline localizada de reporting.\n    \"\"\"\n    return pipeline(\n        [\n            node(\n                build_bridge_summary,\n                [\"backtest_predictions\", \"params:reporting\"],\n                \"bridge_summary\",\n                name=\"build_monthly_and_total_bridges\",\n                tags=[\"bridge\", \"reporting\"],\n            ),\n            node(\n                plot_bridge_chart,\n                [\"bridge_summary\", \"params:reporting\"],\n                \"bridge_chart\",\n                name=\"render_static_bridge_chart\",\n                tags=[\"bridge\", \"figure\"],\n            ),\n            node(\n                build_bridge_app,\n                [\"bridge_summary\", \"backtest_summary\"],\n                \"bridge_app_html\",\n                name=\"build_interactive_bridge_application\",\n                tags=[\"bridge\", \"web_app\"],\n            ),\n            node(\n                build_model_card,\n                [\"backtest_summary\", \"model_input_schema\", \"params:reporting\"],\n                \"model_card\",\n                name=\"materialize_model_card\",\n                tags=[\"governance\", \"reporting\"],\n            ),\n        ],\n        namespace=\"reporting\",\n        inputs={\"backtest_predictions\", \"backtest_summary\", \"model_input_schema\"},\n        outputs={\"bridge_summary\", \"bridge_chart\", \"bridge_app_html\", \"model_card\"},\n        parameters={\"params:reporting\"},\n    )\n"}, {"id": "paso-26", "section": "Reporting", "path": "src/bayesian_tph_forecasting/pipelines/reporting/nodes.py", "description": "Bridge, aplicación interactiva y ficha del modelo.", "language": "py", "source": "\"\"\"\nConstruye el bridge chart, la aplicación HTML autocontenida y la ficha técnica del modelo.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom typing import Any\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\n\nBRIDGE_COMPONENTS = [\n    (\"Base contextual\", \"base_component\", \"base\", \"total\"),\n    (\"Firma geológica\", \"contrib_geology\", \"mine\", \"delta\"),\n    (\"Procedencia\", \"contrib_source\", \"mine\", \"delta\"),\n    (\"Dureza\", \"contrib_hardness\", \"mine\", \"delta\"),\n    (\"Granulometría\", \"contrib_granulometry\", \"plant\", \"delta\"),\n    (\"Circuito aguas arriba\", \"contrib_upstream\", \"plant\", \"delta\"),\n    (\"Cubas en rango\", \"contrib_sumps\", \"plant\", \"delta\"),\n    (\"Chancado auxiliar\", \"contrib_auxiliary_crushing\", \"plant\", \"delta\"),\n    (\"Molienda secundaria\", \"contrib_secondary\", \"plant\", \"delta\"),\n    (\"Esperado por contexto\", \"y_pred_mean\", \"model\", \"total\"),\n    (\"Operación no explicada\", \"residual_actual_minus_model\", \"operation\", \"delta\"),\n    (\"Observado\", \"y_true\", \"actual\", \"total\"),\n]\n\n\ndef _add_reporting_families(backtest_predictions: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Agrupa contribuciones atómicas del modelo en familias legibles para reporting.\n\n    Parámetros:\n    -------------\n    backtest_predictions : predicciones diarias con contribuciones por variable.\n\n    Retorna:\n    ---------\n    pd.DataFrame : copia enriquecida con las familias usadas por el bridge.\n    \"\"\"\n    df = backtest_predictions.copy()\n    df[\"contrib_hardness\"] = df[\"contrib__penetration_rate_mean\"] + df[\"contrib_hardness_mix\"]\n    df[\"contrib_granulometry\"] = (\n        df[\"contrib__feed_fines_pct_mean\"] + df[\"contrib__feed_fines_pct_centered_sq\"]\n    )\n    df[\"contrib_upstream\"] = df[\"contrib__upstream_available_pct\"]\n    df[\"contrib_sumps\"] = df[\"contrib__discharge_sumps_in_range_pct\"]\n    df[\"contrib_auxiliary_crushing\"] = df[\"contrib__auxiliary_crushing_available_pct\"]\n    df[\"contrib_secondary\"] = df[\"contrib__secondary_grinding_available_pct\"]\n    return df\n\n\ndef build_bridge_summary(\n    backtest_predictions: pd.DataFrame,\n    reporting: dict,\n) -> pd.DataFrame:\n    \"\"\"\n    Materializa bridges mensuales y total respetando la identidad observado igual a modelo más residuo.\n\n    Parámetros:\n    -------------\n    backtest_predictions : predicciones diarias fuera de muestra y sus contribuciones.\n    reporting : configuración de presentación del producto de reporting.\n\n    Retorna:\n    ---------\n    pd.DataFrame : componentes ordenados del bridge para cada mes y para el período completo.\n    \"\"\"\n    df = _add_reporting_families(backtest_predictions)\n    df[\"date\"] = pd.to_datetime(df[\"date\"])\n    df[\"month\"] = df[\"date\"].dt.to_period(\"M\").astype(str)\n    periods: list[tuple[str, pd.DataFrame]] = [(\"TOTAL\", df)]\n    periods.extend((month, group) for month, group in df.groupby(\"month\", sort=True))\n\n    rows: list[dict[str, Any]] = []\n    for period, group in periods:\n        for order, (label, column, family, kind) in enumerate(BRIDGE_COMPONENTS):\n            rows.append(\n                {\n                    \"period\": period,\n                    \"order\": order,\n                    \"label\": label,\n                    \"column\": column,\n                    \"family\": family,\n                    \"kind\": kind,\n                    \"value_tph\": float(group[column].mean()),\n                    \"n_days\": int(group[\"date\"].nunique()),\n                }\n            )\n    return pd.DataFrame(rows)\n\n\ndef _waterfall_geometry(bridge: pd.DataFrame) -> tuple[list[float], list[float], list[float]]:\n    \"\"\"\n    Calcula bases, alturas y extremos acumulados para dibujar un gráfico de cascada.\n\n    Parámetros:\n    -------------\n    bridge : componentes ordenados de un único período del bridge.\n\n    Retorna:\n    ---------\n    tuple[list[float], list[float], list[float]] : bases, alturas y extremos de las barras.\n    \"\"\"\n    running = 0.0\n    bottoms: list[float] = []\n    heights: list[float] = []\n    endpoints: list[float] = []\n    for row in bridge.itertuples(index=False):\n        value = float(row.value_tph)\n        if row.kind == \"total\":\n            bottoms.append(0.0)\n            heights.append(value)\n            running = value\n        else:\n            bottoms.append(min(running, running + value))\n            heights.append(abs(value))\n            running += value\n        endpoints.append(running)\n    return bottoms, heights, endpoints\n\n\ndef plot_bridge_chart(bridge_summary: pd.DataFrame, reporting: dict):\n    \"\"\"\n    Genera la vista estática principal del bridge para el período completo.\n\n    Parámetros:\n    -------------\n    bridge_summary : componentes mensuales y totales producidos para reporting.\n    reporting : configuración que contiene el título del gráfico.\n\n    Retorna:\n    ---------\n    matplotlib.figure.Figure : figura estática del gráfico de cascada.\n    \"\"\"\n    bridge = bridge_summary.loc[bridge_summary[\"period\"].eq(\"TOTAL\")].sort_values(\"order\")\n    bottoms, heights, endpoints = _waterfall_geometry(bridge)\n    colors = {\n        \"base\": \"#315B66\",\n        \"mine\": \"#C69C3C\",\n        \"plant\": \"#2B8C87\",\n        \"model\": \"#55717A\",\n        \"operation\": \"#C44E52\",\n        \"actual\": \"#202124\",\n    }\n    x = np.arange(len(bridge))\n    fig, ax = plt.subplots(figsize=(16, 7))\n    bars = ax.bar(\n        x,\n        heights,\n        bottom=bottoms,\n        color=[colors[family] for family in bridge[\"family\"]],\n        edgecolor=\"white\",\n        linewidth=0.8,\n        width=0.76,\n    )\n    endpoint_min, endpoint_max = min(endpoints), max(endpoints)\n    local_span = max(100.0, endpoint_max - endpoint_min)\n    offset = max(8.0, local_span * 0.045)\n    for bar, endpoint, row in zip(bars, endpoints, bridge.itertuples(index=False), strict=True):\n        label = f\"{row.value_tph:+,.0f}\" if row.kind == \"delta\" else f\"{row.value_tph:,.0f}\"\n        ax.text(\n            bar.get_x() + bar.get_width() / 2,\n            endpoint + offset,\n            label,\n            ha=\"center\",\n            va=\"bottom\",\n            fontsize=9,\n            fontweight=\"bold\",\n        )\n    ax.set_xticks(x)\n    ax.set_xticklabels(bridge[\"label\"], rotation=28, ha=\"right\")\n    ax.set_ylabel(\"Rendimiento promedio (tph)\")\n    ax.set_ylim(endpoint_min - 0.20 * local_span, endpoint_max + 0.28 * local_span)\n    fig.suptitle(reporting[\"title\"], x=0.065, y=0.98, ha=\"left\", fontsize=17, fontweight=\"bold\")\n    fig.text(\n        0.065,\n        0.93,\n        \"Caso ex post · ventana móvil de 12 meses · valores medios del período evaluado\",\n        color=\"#5F6B72\",\n        fontsize=10,\n    )\n    ax.grid(axis=\"y\", linestyle=\"--\", alpha=0.25)\n    ax.spines[[\"top\", \"right\"]].set_visible(False)\n    fig.tight_layout(rect=(0, 0, 1, 0.90))\n    return fig\n\n\ndef build_bridge_app(bridge_summary: pd.DataFrame, backtest_summary: pd.DataFrame) -> str:\n    \"\"\"\n    Construye una aplicación estática con selector mensual, unidades y métricas del backtesting.\n\n    Parámetros:\n    -------------\n    bridge_summary : componentes del bridge para todos los períodos disponibles.\n    backtest_summary : métricas agregadas de validación fuera de muestra.\n\n    Retorna:\n    ---------\n    str : documento HTML autocontenido en datos para renderizar la aplicación.\n    \"\"\"\n    bridge_records = bridge_summary.to_dict(orient=\"records\")\n    metrics = backtest_summary.iloc[0].to_dict()\n    payload = json.dumps({\"bridge\": bridge_records, \"metrics\": metrics}, ensure_ascii=False)\n    return f\"\"\"<!doctype html>\n<html lang=\"es\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Bridge contextual de rendimiento<\/title>\n  <script src=\"https://cdn.plot.ly/plotly-3.1.0.min.js\"><\/script>\n  <style>\n    :root{{--ink:#183038;--muted:#65747a;--teal:#2b8c87;--gold:#c69c3c;--red:#c44e52;--panel:#f7f9f8}}\n    *{{box-sizing:border-box}} body{{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff}}\n    main{{max-width:1240px;margin:auto;padding:24px}} header{{display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}}\n    h1{{margin:0;font-size:clamp(24px,3vw,40px)}} p{{color:var(--muted)}} .controls{{display:flex;gap:12px;flex-wrap:wrap}}\n    label{{font-size:13px;font-weight:700}} select{{display:block;margin-top:5px;padding:9px 32px 9px 10px;border:1px solid #cad4d3;border-radius:7px;background:white}}\n    .metrics{{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin:22px 0}}\n    .metric{{background:var(--panel);border:1px solid #e1e8e6;border-radius:10px;padding:14px}} .metric small{{display:block;color:var(--muted)}} .metric b{{font-size:22px}}\n    #chart{{height:620px}} .note{{border-left:4px solid var(--teal);padding:10px 14px;background:var(--panel)}}\n    @media(max-width:760px){{.metrics{{grid-template-columns:repeat(2,1fr)}}#chart{{height:520px}}}}\n  <\/style>\n<\/head>\n<body><main>\n  <header><div><p>MODELO BAYESIANO JERÁRQUICO<\/p><h1>Bridge contextual de rendimiento<\/h1><\/div>\n    <div class=\"controls\"><label>Período<select id=\"period\"><\/select><\/label><label>Unidad<select id=\"unit\"><option value=\"tph\">tph<\/option><option value=\"tpd\">tpd<\/option><\/select><\/label><\/div>\n  <\/header>\n  <section class=\"metrics\" id=\"metrics\"><\/section><div id=\"chart\"><\/div>\n  <p class=\"note\"><b>Lectura:<\/b> el residuo “Operación no explicada” cierra exactamente la identidad entre el rendimiento esperado por contexto y el observado. No representa causalidad automática.<\/p>\n<\/main><script>\nconst DATA={payload};\nconst labels={{rmse:'RMSE',mae:'MAE',bias_pred_minus_actual:'Bias',mean_interval_90_coverage_pct:'Cobertura media',predictive_interval_90_coverage_pct:'Cobertura predictiva'}};\ndocument.getElementById('metrics').innerHTML=Object.entries(labels).map(([k,v])=>`<div class=\"metric\"><small>${{v}}<\/small><b>${{Number(DATA.metrics[k]).toFixed(1)}}<\/b><\/div>`).join('');\nconst periods=[...new Set(DATA.bridge.map(d=>d.period))]; const period=document.getElementById('period');\nperiods.forEach(p=>period.add(new Option(p==='TOTAL'?'Período completo':p,p)));\nfunction draw(){{const p=period.value||'TOTAL',unit=document.getElementById('unit').value,m=unit==='tpd'?24:1,d=DATA.bridge.filter(x=>x.period===p).sort((a,b)=>a.order-b.order);\n const measure=d.map(x=>x.kind==='total'?'absolute':'relative');\n Plotly.react('chart',[{{type:'waterfall',orientation:'v',measure,x:d.map(x=>x.label),y:d.map(x=>x.value_tph*m),text:d.map(x=>`${{x.kind==='delta'&&x.value_tph>=0?'+':''}}${{(x.value_tph*m).toFixed(0)}}`),textposition:'outside',connector:{{line:{{color:'#9aabaa'}}}},increasing:{{marker:{{color:'#2b8c87'}}}},decreasing:{{marker:{{color:'#c44e52'}}}},totals:{{marker:{{color:'#315b66'}}}}}}],{{margin:{{t:55,r:25,b:120,l:75}},title:{{text:`${{p==='TOTAL'?'Período completo':p}} · ${{d[0].n_days}} días`,x:.02}},yaxis:{{title:unit,gridcolor:'#e7ecea'}},xaxis:{{tickangle:-25}},plot_bgcolor:'#fff',paper_bgcolor:'#fff',showlegend:false}},{{responsive:true,displaylogo:false}});}}\nperiod.onchange=draw;document.getElementById('unit').onchange=draw;draw();\n<\/script><\/body><\/html>\"\"\"\n\n\ndef build_model_card(\n    backtest_summary: pd.DataFrame,\n    model_input_schema: dict,\n    reporting: dict,\n) -> dict[str, Any]:\n    \"\"\"\n    Resume propósito, límites, contrato de datos y métricas del modelo.\n\n    Parámetros:\n    -------------\n    backtest_summary : métricas agregadas del backtesting.\n    model_input_schema : contrato publicado de la matriz modelable.\n    reporting : configuración de los intervalos y productos de reporting.\n\n    Retorna:\n    ---------\n    dict[str, Any] : ficha técnica serializable del modelo y su validación.\n    \"\"\"\n    metrics = {\n        key: float(value)\n        if isinstance(value, (np.floating, float))\n        else int(value)\n        if isinstance(value, (np.integer, int))\n        else value\n        for key, value in backtest_summary.iloc[0].to_dict().items()\n    }\n    return {\n        \"model_name\": \"bayesian_tph_forecasting\",\n        \"intended_use\": \"Explicación ex post de desviaciones contextuales de rendimiento.\",\n        \"not_intended_for\": [\n            \"atribución causal automática\",\n            \"pronóstico ex ante sin covariables de plan\",\n            \"control directo de equipos\",\n        ],\n        \"validation_policy\": \"rolling 12 months, two-month horizon\",\n        \"uncertainty\": {\n            \"credible_mean_interval\": \"incertidumbre de la media contextual\",\n            \"posterior_predictive_interval\": \"incertidumbre de una observación diaria\",\n            \"probability\": reporting[\"credible_probability\"],\n        },\n        \"data_contract\": model_input_schema,\n        \"metrics\": metrics,\n    }\n"}, {"id": "paso-27", "section": "Composición", "path": "src/bayesian_tph_forecasting/pipeline_registry.py", "description": "Registro que une las cuatro pipelines en el DAG global.", "language": "py", "source": "\"\"\"\nRegistra el DAG global y las pipelines que pueden ejecutarse de manera independiente.\n\"\"\"\n\nfrom kedro.pipeline import Pipeline\n\nfrom bayesian_tph_forecasting.pipelines import (\n    bayesian_inference,\n    data_engineering,\n    data_science,\n    reporting,\n)\n\n\ndef register_pipelines() -> dict[str, Pipeline]:\n    \"\"\"\n    Construye las pipelines locales y compone el flujo global según sus dependencias de datos.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    dict[str, Pipeline] : pipelines registradas por nombre, incluido el flujo predeterminado.\n    \"\"\"\n    de_pipeline = data_engineering.create_pipeline()\n    ds_pipeline = data_science.create_pipeline()\n    bi_pipeline = bayesian_inference.create_pipeline()\n    reporting_pipeline = reporting.create_pipeline()\n    global_pipeline = de_pipeline + ds_pipeline + bi_pipeline + reporting_pipeline\n\n    return {\n        \"__default__\": global_pipeline,\n        \"global\": global_pipeline,\n        \"data_engineering\": de_pipeline,\n        \"data_science\": ds_pipeline,\n        \"bayesian_inference\": bi_pipeline,\n        \"reporting\": reporting_pipeline,\n    }\n"}, {"id": "paso-28", "section": "Pruebas", "path": "tests/test_public_contracts.py", "description": "Contratos públicos de identificadores, rendimiento y espacio.", "language": "py", "source": "\"\"\"\nVerifica los contratos públicos de identificadores, rendimiento y coordenadas de los extractos.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport pandas as pd\n\nfrom bayesian_tph_forecasting.pipelines.data_engineering.nodes import (\n    classify_source_area,\n)\n\nPROJECT_ROOT = Path(__file__).parents[1]\nRAW = PROJECT_ROOT / \"data\" / \"01_raw\"\n\n\ndef test_public_identifiers_follow_generic_contract() -> None:\n    \"\"\"\n    Comprueba que los identificadores publicados respeten el contrato genérico documentado.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La prueba falla si un identificador o destino viola el contrato.\n    \"\"\"\n    haulage = pd.read_parquet(RAW / \"haulage_cycles.parquet\")\n    assert haulage[\"destination\"].eq(\"PROCESS_FEED\").all()\n    assert haulage[\"truck_id\"].str.fullmatch(r\"HAUL_UNIT_\\d{3}\").all()\n    assert haulage[\"loading_unit_id\"].str.fullmatch(r\"LOAD_UNIT_\\d{3}\").all()\n    assert haulage[\"source_code\"].map(classify_source_area).ne(\"UNCLASSIFIED\").all()\n\n\ndef test_stable_public_line_means_are_in_documented_range() -> None:\n    \"\"\"\n    Comprueba que el rendimiento estable medio de cada línea permanezca en el rango publicado.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La prueba falla si la media estable queda fuera del intervalo documentado.\n    \"\"\"\n    signals = pd.read_parquet(RAW / \"plant_signals_hourly.parquet\")\n    for line in (\"a\", \"b\"):\n        stable = signals.loc[\n            signals[f\"line_{line}_feed_tph\"].ge(700) & signals[f\"line_{line}_power_kw\"].ge(3_500),\n            f\"line_{line}_feed_tph\",\n        ]\n        assert 1_000 <= stable.mean() <= 1_300\n\n\ndef test_public_spatial_frame_is_self_consistent() -> None:\n    \"\"\"\n    Comprueba completitud y coherencia del marco cartesiano local y la dureza.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La prueba falla si existen nulos o coordenadas fuera del marco esperado.\n    \"\"\"\n    haulage = pd.read_parquet(RAW / \"haulage_cycles.parquet\")\n    hardness = pd.read_parquet(RAW / \"hardness_block_model.parquet\")\n    assert haulage[[\"x\", \"y\", \"z\"]].notna().all().all()\n    assert hardness[[\"x\", \"y\", \"z\", \"penetration_rate\", \"hardness_class\"]].notna().all().all()\n    assert haulage[\"x\"].between(-4_000, 4_000).all()\n    assert haulage[\"y\"].between(-3_000, 3_000).all()\n\n\ndef test_public_data_are_obviously_fictional() -> None:\n    \"\"\"\n    Impide publicar accidentalmente fechas históricas o coordenadas con apariencia UTM.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La prueba falla si reaparece una huella temporal o espacial realista.\n    \"\"\"\n    haulage = pd.read_parquet(RAW / \"haulage_cycles.parquet\")\n    signals = pd.read_parquet(RAW / \"plant_signals_hourly.parquet\")\n    assert pd.to_datetime(haulage[\"cycle_timestamp\"]).dt.year.min() >= 2034\n    assert pd.to_datetime(signals[\"timestamp\"]).dt.year.min() >= 2034\n    assert haulage[[\"x\", \"y\"]].abs().to_numpy().max() < 10_000\n"}, {"id": "paso-29", "section": "Pruebas", "path": "tests/test_reporting.py", "description": "Identidad contable que debe cerrar el bridge.", "language": "py", "source": "\"\"\"\nVerifica las identidades contables de los productos de reporting.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\nfrom bayesian_tph_forecasting.pipelines.reporting.nodes import build_bridge_summary\n\n\ndef test_bridge_closes_model_to_observed_identity() -> None:\n    \"\"\"\n    Comprueba que el modelo más el residuo operacional cierre exactamente al valor observado.\n\n    Parámetros:\n    -------------\n    No aplica.\n\n    Retorna:\n    ---------\n    None. La prueba falla cuando el bridge no respeta su identidad contable.\n    \"\"\"\n    predictions = pd.DataFrame(\n        {\n            \"date\": pd.to_datetime([\"2035-01-01\"]),\n            \"base_component\": [100.0],\n            \"contrib_geology\": [2.0],\n            \"contrib_source\": [-1.0],\n            \"contrib_hardness_mix\": [0.5],\n            \"contrib__penetration_rate_mean\": [0.5],\n            \"contrib__feed_fines_pct_mean\": [1.0],\n            \"contrib__feed_fines_pct_centered_sq\": [0.0],\n            \"contrib__upstream_available_pct\": [1.0],\n            \"contrib__discharge_sumps_in_range_pct\": [1.0],\n            \"contrib__auxiliary_crushing_available_pct\": [1.0],\n            \"contrib__secondary_grinding_available_pct\": [1.0],\n            \"y_pred_mean\": [108.0],\n            \"residual_actual_minus_model\": [-3.0],\n            \"y_true\": [105.0],\n        }\n    )\n    bridge = build_bridge_summary(predictions, reporting={})\n    total = bridge.loc[bridge[\"period\"].eq(\"TOTAL\")].set_index(\"column\")[\"value_tph\"]\n    assert total[\"y_pred_mean\"] + total[\"residual_actual_minus_model\"] == total[\"y_true\"]\n"}];
function syncTheme(){try{document.documentElement.dataset.theme=parent.document.body.classList.contains('quarto-dark')?'dark':'light'}catch{}}syncTheme();try{new MutationObserver(syncTheme).observe(parent.document.body,{attributes:true,attributeFilter:['class']})}catch{}
const nav=document.getElementById('steps'),source=document.getElementById('source'),search=document.getElementById('search');let current=0;
nav.addEventListener('wheel',event=>{if(Math.abs(event.deltaY)>Math.abs(event.deltaX)){nav.scrollTop+=event.deltaY;event.preventDefault()}},{passive:false});
function escapeHtml(value){return value.replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))}
function decorate(value,pattern){let output='',last=0,match;while((match=pattern.exec(value))!==null){output+=escapeHtml(value.slice(last,match.index));const token=match[0],kind=Object.entries(match.groups||{}).find(([,content])=>content!==undefined)?.[0]||'operator';output+=`<span class="tok-${kind}">${escapeHtml(token)}</span>`;last=match.index+token.length;if(token.length===0)pattern.lastIndex++}return output+escapeHtml(value.slice(last))}
function highlightSource(value,language){
  if(language==='py')return decorate(value,/(?<string>"{3}[\s\S]*?"{3}|'{3}[\s\S]*?'{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(?<comment>\#[^\n]*)|(?<keyword>\b(?:and|as|assert|async|await|break|case|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|match|nonlocal|not|or|pass|raise|return|try|while|with|yield)\b)|(?<builtin>\b(?:Any|True|False|None|bool|dict|float|int|list|set|str|tuple)\b)|(?<number>\b(?:0[xob][\da-fA-F]+|\d+(?:\.\d+)?)\b)/g);
  if(language==='md')return decorate(value,/(?<heading>^#{1,6}\s.*$)|(?<markup>^\s*(?:```|[-*+]\s|\d+\.\s).*$|`[^`]+`|\*{1,2}[^*]+\*{1,2}|\[[^\]]+\]\([^\)]+\))/gm);
  if(['yml','yaml','toml','sh','bash'].includes(language))return decorate(value,/(?<comment>\#[^\n]*)|(?<string>"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(?<key>^[ \t]*[A-Za-z_][\w.-]*(?=\s*[:=]))|(?<keyword>\b(?:true|false|null|yes|no|if|then|else|fi|for|in|do|done|case|esac|function|export)\b)|(?<number>\b\d+(?:\.\d+)?\b)/gmi);
  return escapeHtml(value)
}
function visibleIndexes(){const q=search.value.trim().toLowerCase();return FILES.map((f,i)=>[f,i]).filter(([f])=>!q||`${f.section} ${f.path} ${f.description}`.toLowerCase().includes(q)).map(([,i])=>i)}
function renderNav(){const visible=visibleIndexes();nav.innerHTML='';visible.forEach(i=>{const f=FILES[i],button=document.createElement('button');button.className=`step${i===current?' active':''}`;button.innerHTML=`<small>${String(i+1).padStart(2,'0')} · ${f.section}</small>${f.path}`;button.onclick=()=>show(i);nav.appendChild(button)})}
function show(index){current=Math.max(0,Math.min(FILES.length-1,index));const f=FILES[current];document.getElementById('section').textContent=f.section;document.getElementById('path').textContent=f.path;document.getElementById('description').textContent=f.description;document.getElementById('counter').textContent=`${current+1} / ${FILES.length}`;source.innerHTML=highlightSource(f.source,f.language);document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===FILES.length-1;history.replaceState(null,'',`#${f.id}`);renderNav();document.querySelector('.code-wrap').scrollTop=0;document.querySelector('.step.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
search.oninput=renderNav;document.getElementById('previous').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('copy').onclick=async e=>{await navigator.clipboard.writeText(FILES[current].source);const old=e.target.textContent;e.target.textContent='Copiado';setTimeout(()=>e.target.textContent=old,1200)};
document.addEventListener('keydown',e=>{if(e.target===search)return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});const initial=FILES.findIndex(f=>`#${f.id}`===location.hash);show(initial>=0?initial:0);
