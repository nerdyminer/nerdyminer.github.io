[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-tph-forecasting"
version = "0.1.0"
description = "Proyecto educativo de Kedro para explicar ex post el rendimiento de un circuito de conminución ficticio."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "arviz==0.22.0",
  "h5py==3.15.1",
  "kedro==1.5.0",
  "kedro-datasets[pandas,matplotlib,pickle,text,json]==9.5.0",
  "kedro-viz==12.4.0",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "plotly>=6.0,<7",
  "pyarrow>=17,<24",
  "pymc>=5.25,<6",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
bayesian-tph-forecasting = "bayesian_tph_forecasting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "bayesian_tph_forecasting"
project_name = "Bayesian TPH Forecasting"
kedro_init_version = "1.5.0"
source_dir = "src"
tools = ["Lint", "Test", "Log", "Data Structure"]
example_pipeline = "False"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.kedro_telemetry]
project_id = "f0082d33c58d4fa7ae37a159ba19339d"
