# 01_raw: contratos de entrada sintéticos, estáticos y reproducibles.
geology_daily_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/geology_daily.csv
  load_args:
    parse_dates: [date]

plant_signals_hourly_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/plant_signals_hourly.parquet

haulage_cycles_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/haulage_cycles.parquet

hardness_block_model_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/hardness_block_model.parquet

# 02_intermediate: tablas limpiadas o enriquecidas, aún cercanas a su fuente.
plant_signals_hourly_clean:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/plant_signals_hourly_clean.parquet

haulage_cycles_with_hardness:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/haulage_cycles_with_hardness.parquet

mine_zone_components:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/mine_zone_components.parquet

mine_zone_vertices:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/mine_zone_vertices.parquet

# 03_primary: entidades diarias con semántica de negocio estable.
plant_target_daily:
  type: pandas.ParquetDataset
  filepath: data/03_primary/plant_target_daily.parquet

plant_context_daily:
  type: pandas.ParquetDataset
  filepath: data/03_primary/plant_context_daily.parquet

geology_composition_daily:
  type: pandas.ParquetDataset
  filepath: data/03_primary/geology_composition_daily.parquet

spatial_context_daily:
  type: pandas.ParquetDataset
  filepath: data/03_primary/spatial_context_daily.parquet

# 04_feature: resultados de aprendizaje no supervisado reutilizables.
geological_signatures_daily:
  type: pandas.ParquetDataset
  filepath: data/04_feature/geological_signatures_daily.parquet

geological_clustering_artifact:
  type: pickle.PickleDataset
  filepath: data/06_models/geological_clustering_artifact.pkl

clustering_diagnostics:
  type: pandas.CSVDataset
  filepath: data/07_model_output/clustering_diagnostics.csv

# 05_model_input: una fila por día y todos los predictores contractuales.
model_input_daily:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/model_input_daily.parquet

model_input_schema:
  type: json.JSONDataset
  filepath: data/05_model_input/model_input_schema.json

# 06_models y 07_model_output: posterior final y resultados del backtesting móvil.
final_inference_data:
  type: bayesian_tph_forecasting.datasets.inference_data_dataset.InferenceDataDataset
  filepath: data/06_models/final_inference_data.nc

backtest_predictions:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/backtest_predictions.parquet

backtest_fold_metrics:
  type: pandas.CSVDataset
  filepath: data/07_model_output/backtest_fold_metrics.csv

backtest_summary:
  type: pandas.CSVDataset
  filepath: data/07_model_output/backtest_summary.csv

posterior_parameter_summary:
  type: pandas.CSVDataset
  filepath: data/07_model_output/posterior_parameter_summary.csv

# 08_reporting: productos finales consumidos directamente por el blog.
bridge_summary:
  type: pandas.CSVDataset
  filepath: data/08_reporting/bridge_summary.csv

bridge_chart:
  type: matplotlib.MatplotlibDataset
  filepath: assets/bridge_chart.png
  save_args:
    dpi: 220
    bbox_inches: tight

bridge_app_html:
  type: text.TextDataset
  filepath: app/bridge.html

model_card:
  type: json.JSONDataset
  filepath: data/08_reporting/model_card.json
