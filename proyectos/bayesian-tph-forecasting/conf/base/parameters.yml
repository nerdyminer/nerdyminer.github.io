analysis:
  training_end: "2034-12-31"
  evaluation_start: "2035-01-01"
  evaluation_end: "2035-12-30"

plant:
  stable_feed_min_tph: 700.0
  stable_power_min_kw: 3500.0
  intermediate_stockpile_min_m: 8.0
  discharge_sump_range_pct: [40.0, 90.0]
  online_threshold: 0.5

spatial:
  geometry_training_end: "2034-12-31"
  grid_m: 25.0
  dbscan_eps_m: 140.0
  dbscan_min_samples: 3
  min_cycles_per_component: 300
  min_component_share: 0.005
  hull_trim_quantile: 0.005
  max_hardness_match_distance_m: 180.0
  min_cycles_per_day: 20

geology_clustering:
  training_end: "2034-12-31"
  min_clusters: 2
  max_clusters: 10
  random_seed: 42

features:
  min_zone_mean_share_pct: 0.5
  min_hardness_mean_share_pct: 0.5
  zone_reference_strategy: most_frequent
  hardness_reference: hardness_share__medium

bayesian:
  regular_features:
    - upstream_available_pct
    - discharge_sumps_in_range_pct
    - auxiliary_crushing_available_pct
    - secondary_grinding_available_pct
    - penetration_rate_mean
    - feed_fines_pct_mean
    - feed_fines_pct_centered_sq
  prior_std_multiplier: 2.0
  hac_maxlags: 7
  zone_scale_prior_tph: 55.0
  hardness_scale_prior_tph: 45.0
  cluster_scale_prior_tph: 75.0
  random_seed: 123
  sampling:
    draws: 600
    tune: 1000
    chains: 4
    cores: 4
    target_accept: 0.99
    progressbar: true

backtest:
  start: "2035-01-01"
  end: "2035-12-31"
  rolling_train_months: 12
  horizon_months: 2
  step_months: 2
  min_train_days: 180
  min_test_days: 20
  sampling:
    draws: 300
    tune: 500
    chains: 4
    cores: 4
    target_accept: 0.99
    progressbar: false

reporting:
  bridge_period: "2035"
  credible_probability: 0.90
  title: "Descomposición contextual del rendimiento observado"
