bayesian:
  regular_features:
    - upstream_available_pct
    - discharge_sumps_in_range_pct
    - auxiliary_crushing_available_pct
    - secondary_grinding_available_pct
    - penetration_rate_mean
    - feed_fines_pct_mean
    - feed_fines_pct_centered_sq
  prior_std_multiplier: 2.0
  hac_maxlags: 7
  zone_scale_prior_tph: 55.0
  hardness_scale_prior_tph: 45.0
  cluster_scale_prior_tph: 75.0
  random_seed: 123
  sampling:
    draws: 40
    tune: 40
    chains: 1
    cores: 1
    target_accept: 0.90
    progressbar: false

backtest:
  start: "2035-01-01"
  end: "2035-12-31"
  rolling_train_months: 12
  horizon_months: 3
  step_months: 3
  min_train_days: 180
  min_test_days: 15
  sampling:
    draws: 30
    tune: 30
    chains: 1
    cores: 1
    target_accept: 0.90
    progressbar: false
