[project]
name = "stockpile-ca"
version = "0.1.0"
description = "Replica pedagogica de un automata celular continuo 3D para un acopio de mineral"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dagster>=1.11,<2",
  "numpy>=2.0",
  "polars>=1.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["dagster-webserver>=1.11,<2", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockpile_ca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_source_explorer.py" = ["E501"]
"scripts/build_dagster_snapshot.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
