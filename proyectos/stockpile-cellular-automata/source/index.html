       <\/section>\n\n        <section className=\"diagnostic-section\">\n          <div className=\"section-heading\"><span className=\"eyebrow\">Tomografía del modelo<\/span><h2>Tres planos, una misma memoria interna<\/h2><\/div>\n          <div className=\"planes\">\n            <ViewPanel title=\"Planta – X–Y\" caption=\"Segregación y conos de extracción\">\n              {frame ? <OrthogonalView index={index} frame={frame} plane=\"plan\" width={520} height={360} showFeeders={showFeeders} colourMapId={COLOUR_MAP_ID} /> : <Placeholder width={520} height={360} loading={loading} />}\n            <\/ViewPanel>\n            <ViewPanel title=\"Corte X–vertical\" caption=\"Estratificación sobre el eje rotado\">\n              {frame ? <OrthogonalView index={index} frame={frame} plane=\"sectionEast\" width={520} height={360} showFeeders={showFeeders} colourMapId={COLOUR_MAP_ID} /> : <Placeholder width={520} height={360} loading={loading} />}\n            <\/ViewPanel>\n            <ViewPanel title=\"Corte Y–vertical\" caption=\"Zona viva sobre los alimentadores\">\n              {frame ? <OrthogonalView index={index} frame={frame} plane=\"sectionNorth\" width={520} height={360} showFeeders={showFeeders} colourMapId={COLOUR_MAP_ID} /> : <Placeholder width={520} height={360} loading={loading} />}\n            <\/ViewPanel>\n          <\/div>\n        <\/section>\n\n        {range ? <section className=\"reconciliation-section\">\n          <div className=\"section-heading\"><span className=\"eyebrow\">Modelo contra instrumento<\/span><h2>Reconciliación operacional<\/h2><\/div>\n          <div className=\"reconciliation-grid\">\n          <HeightReconciliation\n            range={range}\n            frameIndex={frameIndex}\n            designHeightM={index.designHeightM ?? null}\n            onFrameChange={setFrameIndex}\n          />\n          <SizeReconciliation range={range} sizeUnit={sizeUnit} />\n          <\/div>\n          {range.reconciliation === null ? (\n            <p className=\"range-notice\">\n              Este export no incluye series de reconciliacion. Regenerar los cuadros con{\" \"}\n              <code>uv run stockpile-frames<\/code> para obtenerlas.\n            <\/p>\n          ) : null}\n        <\/section> : null}\n      <\/main>\n      <footer className=\"brand-footer\"><strong>Digital Twin Lab – Demostración pedagógica<\/strong><span>{index.days.length} días disponibles<\/span><span>Escenario sintético – Equipos con nomenclatura ficticia<\/span><\/footer>\n    <\/div>\n  );\n}\n\nfunction Metric({ label, value, unit }: { label: string; value: string; unit: string }): JSX.Element {\n  return <div className=\"metric\"><span>{label}<\/span><strong>{value}<small>{unit}<\/small><\/strong><\/div>;\n}\n\nfunction ViewPanel({\n  title,\n  caption,\n  children,\n}: {\n  title: string;\n  caption: string;\n  children: React.ReactNode;\n}): JSX.Element {\n  return (\n    <figure className=\"view-panel\">\n      <figcaption>\n        <strong>{title}<\/strong>\n        <span>{caption}<\/span>\n      <\/figcaption>\n      {children}\n    <\/figure>\n  );\n}\n\nfunction Placeholder({\n  width,\n  height,\n  loading,\n}: {\n  width: number;\n  height: number;\n  loading: boolean;\n}): JSX.Element {\n  return (\n    <div className=\"placeholder\" style={{ width: \"100%\", aspectRatio: `${width} / ${height}` }}>\n      {loading ? \"Descargando cuadros…\" : \"Sin datos para el rango\"}\n    <\/div>\n  );\n}\n\nexport default App;\n"}, {"section": "Visor", "path": "app-src/src/components/Stockpile3D.tsx", "description": "Proyección y cámara orbitable sobre canvas.", "language": "tsx", "source": "/**\n * Vista tridimensional del acopio con camara orbitable.\n *\n * El acopio es un campo de alturas sobre una grilla regular, de modo que no hace\n * falta un motor 3D completo: basta proyectar cada columna como un prisma y\n * dibujarlas de atras hacia adelante para que el algoritmo del pintor resuelva\n * la oclusion. Eso evita una dependencia de varios cientos de kilobytes y\n * mantiene el control total sobre el color, que aqui codifica granulometria y es\n * el mensaje de la figura.\n *\n * Proyeccion\n * ----------\n * Con azimut ``theta`` y elevacion ``phi``, cada punto del mundo se lleva a\n * pantalla mediante:\n *\n *     derecha    = x cos(theta) + y sin(theta)\n *     adelante   = -x sin(theta) + y cos(theta)\n *     pantallaX  = derecha\n *     pantallaY  = adelante sin(phi) - z cos(phi)\n *\n * Con ``phi`` de 90 grados la vista queda cenital y con ``phi`` de 0 queda a ras\n * de suelo.\n *\n * Orden de dibujo\n * ---------------\n * ``adelante`` crece hacia el observador, de modo que las columnas se dibujan de\n * menor a mayor: primero el fondo y encima el frente. Invertir este orden hace\n * que la pared trasera del acopio se pinte sobre todo lo demas y la figura se\n * vea hueca y del reves.\n */\n\nimport { useCallback, useEffect, useRef, useState } from \"react\";\n\nimport type { ColourMapId } from \"../colormaps\";\nimport { colourScale } from \"../colormaps\";\nimport type { FeederInfo, Frame, FramesIndex } from \"../frames\";\n\ninterface Stockpile3DProps {\n  index: FramesIndex;\n  frame: Frame;\n  width: number;\n  height: number;\n  verticalExaggeration: number;\n  showFeeders: boolean;\n  colourMapId: ColourMapId;\n}\n\ninterface Camera {\n  azimuthDeg: number;\n  elevationDeg: number;\n  zoom: number;\n}\n\nconst DEFAULT_CAMERA: Camera = { azimuthDeg: 35, elevationDeg: 34, zoom: 1 };\nconst MIN_ELEVATION_DEG = 4;\nconst MAX_ELEVATION_DEG = 88;\nconst FEEDER_MARKER_RADIUS = 5;\nconst MINIMUM_ZOOM = 0.4;\nconst MAXIMUM_ZOOM = 3;\nconst ZOOM_STEP = 1.15;\n\nexport function Stockpile3D({\n  index,\n  frame,\n  width,\n  height,\n  verticalExaggeration,\n  showFeeders,\n  colourMapId,\n}: Stockpile3DProps): JSX.Element {\n  const canvasRef = useRef<HTMLCanvasElement>(null);\n  const [camera, setCamera] = useState<Camera>(DEFAULT_CAMERA);\n  const dragRef = useRef<{ x: number; y: number } | null>(null);\n\n  const onPointerDown = useCallback((event: React.PointerEvent<HTMLCanvasElement>) => {\n    dragRef.current = { x: event.clientX, y: event.clientY };\n    event.currentTarget.setPointerCapture(event.pointerId);\n  }, []);\n\n  const onPointerMove = useCallback((event: React.PointerEvent<HTMLCanvasElement>) => {\n    const origin = dragRef.current;\n\n    if (!origin) {\n      return;\n    }\n\n    const deltaX = event.clientX - origin.x;\n    const deltaY = event.clientY - origin.y;\n    dragRef.current = { x: event.clientX, y: event.clientY };\n\n    setCamera((current) => ({\n      ...current,\n      azimuthDeg: (current.azimuthDeg + deltaX * 0.4) % 360,\n      // Arrastrar hacia arriba sube la camara y deja ver el acopio desde mas\n      // alto, que es como responde cualquier visor orbital. Con el signo\n      // contrario la figura giraba al reves de la mano.\n      elevationDeg: Math.min(\n        MAX_ELEVATION_DEG,\n        Math.max(MIN_ELEVATION_DEG, current.elevationDeg + deltaY * 0.3),\n      ),\n    }));\n  }, []);\n\n  const onPointerUp = useCallback((event: React.PointerEvent<HTMLCanvasElement>) => {\n    dragRef.current = null;\n    event.currentTarget.releasePointerCapture(event.pointerId);\n  }, []);\n\n  const applyZoom = useCallback((factor: number) => {\n    setCamera((current) => ({\n      ...current,\n      zoom: Math.min(MAXIMUM_ZOOM, Math.max(MINIMUM_ZOOM, current.zoom * factor)),\n    }));\n  }, []);\n\n  /*\n   * La rueda solo hace zoom con Ctrl o Cmd pulsado, y en ese caso se cancela el\n   * desplazamiento de la pagina. Sin el modificador la rueda desplaza la pagina\n   * con normalidad.\n   *\n   * El lienzo ocupa mas de mil pixeles de alto: capturar la rueda sin condicion\n   * dejaria al usuario atrapado, incapaz de bajar por el documento con el puntero\n   * sobre la vista. Y capturarla sin cancelar el evento produce lo contrario, que\n   * es lo que ocurria antes: la pagina se desplazaba mientras la vista hacia zoom.\n   *\n   * El listener se registra a mano porque React entrega los eventos de rueda en\n   * modo pasivo, donde `preventDefault` no tiene efecto.\n   */\n  useEffect(() => {\n    const canvas = canvasRef.current;\n\n    if (!canvas) {\n      return;\n    }\n\n    const onWheel = (event: WheelEvent): void => {\n      if (!event.ctrlKey && !event.metaKey) {\n        return;\n      }\n\n      event.preventDefault();\n      applyZoom(event.deltaY > 0 ? 1 / ZOOM_STEP : ZOOM_STEP);\n    };\n\n    canvas.addEventListener(\"wheel\", onWheel, { passive: false });\n\n    return () => canvas.removeEventListener(\"wheel\", onWheel);\n  }, [applyZoom]);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    const context = canvas?.getContext(\"2d\");\n\n    if (!canvas || !context) {\n      return;\n    }\n\n    draw(context, canvas, index, frame, camera, {\n      width,\n      height,\n      verticalExaggeration,\n      showFeeders,\n      sizeColour: colourScale(colourMapId),\n    });\n  }, [index, frame, camera, width, height, verticalExaggeration, showFeeders, colourMapId]);\n\n  return (\n    <div className=\"viewport\">\n      <canvas\n        ref={canvasRef}\n        style={{ width: \"100%\", height: \"auto\", aspectRatio: `${width} / ${height}`, touchAction: \"none\", cursor: \"grab\" }}\n        onPointerDown={onPointerDown}\n        onPointerMove={onPointerMove}\n        onPointerUp={onPointerUp}\n        onPointerCancel={onPointerUp}\n      />\n      <div className=\"viewport-overlay\">\n        <span>\n          Azimut {Math.round(((camera.azimuthDeg % 360) + 360) % 360)}&deg; – Elevación{\" \"}\n          {Math.round(camera.elevationDeg)}&deg;\n        <\/span>\n        <button type=\"button\" onClick={() => applyZoom(ZOOM_STEP)} aria-label=\"Acercar\">\n          +\n        <\/button>\n        <button type=\"button\" onClick={() => applyZoom(1 / ZOOM_STEP)} aria-label=\"Alejar\">\n          &minus;\n        <\/button>\n        <button type=\"button\" onClick={() => setCamera(DEFAULT_CAMERA)}>\n          Restablecer vista\n        <\/button>\n      <\/div>\n      <p className=\"viewport-hint\">\n        Arrastrar para orbitar. Ctrl y rueda, o los botones, para acercar; la rueda sola desplaza\n        la pagina.\n      <\/p>\n    <\/div>\n  );\n}\n\ninterface DrawOptions {\n  width: number;\n  height: number;\n  verticalExaggeration: number;\n  showFeeders: boolean;\n  sizeColour: (fraction: number) => string;\n}\n\nfunction draw(\n  context: CanvasRenderingContext2D,\n  canvas: HTMLCanvasElement,\n  index: FramesIndex,\n  frame: Frame,\n  camera: Camera,\n  options: DrawOptions,\n): void {\n  const { width, height, verticalExaggeration, showFeeders, sizeColour } = options;\n  const ratio = window.devicePixelRatio || 1;\n  canvas.width = width * ratio;\n  canvas.height = height * ratio;\n  context.setTransform(ratio, 0, 0, ratio, 0, 0);\n  context.clearRect(0, 0, width, height);\n\n  const { nEast, nNorth, cellSizeM, centreEast, centreNorth } = index.grid;\n  const azimuth = (camera.azimuthDeg * Math.PI) / 180;\n  const elevation = (camera.elevationDeg * Math.PI) / 180;\n  const cosAzimuth = Math.cos(azimuth);\n  const sinAzimuth = Math.sin(azimuth);\n  const sinElevation = Math.sin(elevation);\n  const cosElevation = Math.cos(elevation);\n  const geometryRotation = ((index.rotationDeg ?? 0) * Math.PI) / 180;\n  const cosGeometry = Math.cos(geometryRotation);\n  const sinGeometry = Math.sin(geometryRotation);\n\n  const rotateGeometry = (x: number, y: number): [number, number] => [\n    x * cosGeometry - y * sinGeometry,\n    x * sinGeometry + y * cosGeometry,\n  ];\n\n  const span = Math.max(nEast, nNorth) * cellSizeM;\n  const scale = ((Math.min(width, height) * 0.78) / span) * camera.zoom;\n  const originX = width / 2;\n  const originY = height * 0.58;\n  const [minSize, maxSize] = index.sizeRangeIn;\n  const sizeSpan = Math.max(maxSize - minSize, 1e-6);\n\n  const project = (worldX: number, worldY: number, worldZ: number): [number, number] => {\n    const right = worldX * cosAzimuth + worldY * sinAzimuth;\n    const forward = -worldX * sinAzimuth + worldY * cosAzimuth;\n\n    return [\n      originX + right * scale,\n      originY + (forward * sinElevation - worldZ * verticalExaggeration * cosElevation) * scale,\n    ];\n  };\n\n  const order: number[] = [];\n\n  for (let north = 0; north < nNorth; north += 1) {\n    for (let east = 0; east < nEast; east += 1) {\n      order.push(north * nEast + east);\n    }\n  }\n\n  order.sort((left, right) => forwardOf(left) - forwardOf(right));\n\n  function forwardOf(cellIndex: number): number {\n    const north = Math.floor(cellIndex / nEast);\n    const east = cellIndex % nEast;\n    const [worldX, worldY] = rotateGeometry(\n      (east - centreEast) * cellSizeM,\n      (north - centreNorth) * cellSizeM,\n    );\n\n    return -worldX * sinAzimuth + worldY * cosAzimuth;\n  }\n\n  const half = cellSizeM / 2;\n\n  for (const cellIndex of order) {\n    const elevationM = frame.height[cellIndex]! / index.scales.height;\n\n    if (elevationM <= 0) {\n      continue;\n    }\n\n    const north = Math.floor(cellIndex / nEast);\n    const east = cellIndex % nEast;\n    const sourceX = (east - centreEast) * cellSizeM;\n    const sourceY = (north - centreNorth) * cellSizeM;\n    const size = frame.columnSize[cellIndex]! / index.scales.size;\n    const colour = sizeColour(size > 0 ? (size - minSize) / sizeSpan : Number.NaN);\n\n    const corners = [\n      rotateGeometry(sourceX - half, sourceY - half),\n      rotateGeometry(sourceX + half, sourceY - half),\n      rotateGeometry(sourceX + half, sourceY + half),\n      rotateGeometry(sourceX - half, sourceY + half),\n    ];\n    const topCorners = corners.map(([x, y]) => project(x, y, elevationM));\n    const baseCorners = corners.map(([x, y]) => project(x, y, 0));\n\n    for (let corner = 0; corner < 4; corner += 1) {\n      const next = (corner + 1) % 4;\n      const a = topCorners[corner]!;\n      const b = topCorners[next]!;\n      const c = baseCorners[next]!;\n      const d = baseCorners[corner]!;\n\n      if ((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]) <= 0) {\n        continue;\n      }\n\n      context.fillStyle = shade(colour, 0.55 + corner * 0.06);\n      context.beginPath();\n      context.moveTo(a[0], a[1]);\n      context.lineTo(b[0], b[1]);\n      context.lineTo(c[0], c[1]);\n      context.lineTo(d[0], d[1]);\n      context.closePath();\n      context.fill();\n    }\n\n    context.fillStyle = colour;\n    context.beginPath();\n    context.moveTo(topCorners[0]![0], topCorners[0]![1]);\n\n    for (let corner = 1; corner < 4; corner += 1) {\n      context.lineTo(topCorners[corner]![0], topCorners[corner]![1]);\n    }\n\n    context.closePath();\n    context.fill();\n  }\n\n  if (showFeeders) {\n    drawInfrastructure(context, index, frame, project);\n  }\n}\n\n/**\n * Dibuja los puntos de extraccion sobre la base del acopio.\n *\n * Se pintan siempre, incluso cuando quedan bajo el material, porque su posicion\n * respecto del eje es lo que explica el flujo: la fila mas alejada recupera\n * desde la periferia, que el flujo superficial deja mas gruesa.\n */\nfunction drawInfrastructure(\n  context: CanvasRenderingContext2D,\n  index: FramesIndex,\n  frame: Frame,\n  project: (x: number, y: number, z: number) => [number, number],\n): void {\n  const { cellSizeM, centreEast, centreNorth } = index.grid;\n\n  if (index.conveyor) {\n    const bearing = (index.conveyor.bearingDeg * Math.PI) / 180;\n    const reach = Math.min(index.grid.nEast, index.grid.nNorth) * cellSizeM * 0.46;\n    const inclination = ((index.conveyor.inclinationDeg ?? 15) * Math.PI) / 180;\n    let apexHeightM = 0;\n    for (const encodedHeight of frame.height) {\n      apexHeightM = Math.max(apexHeightM, encodedHeight / index.scales.height);\n    }\n    /*\n     * La correa es infraestructura fija. Su cabeza se ancla a la cota de\n     * diseño pública y no al ápice instantáneo: el stockpile puede crecer o\n     * vaciarse bajo ella, pero la estructura no acompaña ese movimiento.\n     * Sólo el extremo inferior de la caída libre sigue la superficie.\n     */\n    const designHeightM =\n      index.designHeightM ??\n      index.grid.nVertical * (index.grid.verticalCellSizeM ?? index.grid.cellSizeM);\n    const headZ = designHeightM + (index.conveyor.dischargeClearanceM ?? 1.32);\n    const tailZ = Math.max(2, headZ - Math.tan(inclination) * reach);\n    const tailX = -Math.sin(bearing) * reach;\n    const tailY = -Math.cos(bearing) * reach;\n    const start = project(tailX, tailY, tailZ);\n    const end = project(0, 0, headZ);\n\n    context.save();\n    // Dos pórticos visibles en el tramo exterior fijan la cota de la correa.\n    for (const fraction of [0.08, 0.27]) {\n      const x = tailX * (1 - fraction);\n      const y = tailY * (1 - fraction);\n      const z = tailZ + (headZ - tailZ) * fraction;\n      const base = project(x, y, 0);\n      const top = project(x, y, z);\n      context.strokeStyle = \"rgba(38, 62, 68, 0.72)\";\n      context.lineWidth = 2;\n      context.beginPath();\n      context.moveTo(base[0] - 5, base[1]);\n      context.lineTo(top[0], top[1]);\n      context.lineTo(base[0] + 5, base[1]);\n      context.stroke();\n    }\n\n    context.strokeStyle = \"rgba(28, 20, 31, 0.68)\";\n    context.lineWidth = 9;\n    context.beginPath();\n    context.moveTo(start[0], start[1]);\n    context.lineTo(end[0], end[1]);\n    context.stroke();\n    context.strokeStyle = \"#9b1b72\";\n    context.lineWidth = 5;\n    context.stroke();\n    context.strokeStyle = \"#f3a8d5\";\n    context.lineWidth = 1;\n    context.stroke();\n\n    context.fillStyle = \"#9b1b72\";\n    context.beginPath();\n    context.arc(end[0], end[1], 7, 0, Math.PI * 2);\n    context.fill();\n    context.strokeStyle = \"#ffffff\";\n    context.lineWidth = 2;\n    context.stroke();\n\n    // El tramo ámbar es la caída libre desde la cabeza de la correa al ápice.\n    const impact = project(0, 0, apexHeightM);\n    context.strokeStyle = \"#f0b429\";\n    context.lineWidth = 3;\n    context.setLineDash([3, 4]);\n    context.beginPath();\n    context.moveTo(end[0], end[1] + 4);\n    context.lineTo(impact[0], impact[1]);\n    context.stroke();\n    context.setLineDash([]);\n\n    const labelX = start[0] + (end[0] - start[0]) * 0.42;\n    const labelY = start[1] + (end[1] - start[1]) * 0.42 - 14;\n    context.font = \"700 12px Inter, Arial, sans-serif\";\n    const label = \"CORREA ELEVADA\";\n    const labelWidth = context.measureText(label).width + 18;\n    context.fillStyle = \"rgba(7, 24, 29, 0.88)\";\n    context.beginPath();\n    context.roundRect(labelX - labelWidth / 2, labelY - 14, labelWidth, 22, 7);\n    context.fill();\n    context.fillStyle = \"#f7d5ea\";\n    context.textAlign = \"center\";\n    context.fillText(label, labelX, labelY + 1);\n    context.restore();\n  }\n\n  const byLine = new Map<number, FeederInfo[]>();\n\n  for (const feeder of index.feeders) {\n    byLine.set(feeder.line, [...(byLine.get(feeder.line) ?? []), feeder]);\n  }\n\n  for (const [line, feeders] of byLine) {\n    const colour = line === 1 ? \"#007ED3\" : \"#E97132\";\n    const points = feeders.map((feeder) =>\n      project(\n        (feeder.east - centreEast) * cellSizeM,\n        (feeder.north - centreNorth) * cellSizeM,\n        0,\n      ),\n    );\n\n    context.strokeStyle = colour;\n    context.lineWidth = 2;\n    context.setLineDash([6, 4]);\n    context.beginPath();\n    context.moveTo(points[0]![0], points[0]![1]);\n\n    for (let index = 1; index < points.length; index += 1) {\n      context.lineTo(points[index]![0], points[index]![1]);\n    }\n\n    context.stroke();\n    context.setLineDash([]);\n\n    for (const [index, point] of points.entries()) {\n      context.beginPath();\n      context.arc(point[0], point[1], FEEDER_MARKER_RADIUS, 0, Math.PI * 2);\n      context.fillStyle = colour;\n      context.fill();\n      context.strokeStyle = \"#ffffff\";\n      context.lineWidth = 2;\n      context.stroke();\n\n      context.fillStyle = \"#434444\";\n      context.font = \"600 10px Calibri, sans-serif\";\n      context.textAlign = \"center\";\n      context.fillText(feeders[index]!.name, point[0], point[1] + 17);\n    }\n  }\n}\n\n/** Oscurece un color `rgb(...)` por un factor multiplicativo. */\nfunction shade(colour: string, factor: number): string {\n  const parsed = colour.match(/\\d+/g);\n\n  if (!parsed || parsed.length < 3) {\n    return colour;\n  }\n\n  const channels = parsed\n    .slice(0, 3)\n    .map((value) => Math.round(Math.min(255, Number(value) * factor)))\n    .join(\", \");\n\n  return `rgb(${channels})`;\n}\n"}, {"section": "Visor", "path": "app-src/src/components/OrthogonalViews.tsx", "description": "Planta y cortes verticales.", "language": "tsx", "source": "/**\n * Vistas ortogonales del acopio: planta y los dos cortes verticales por el eje.\n *\n * La vista en planta muestra el tamano medio de cada columna y es donde se lee\n * la segregacion radial. Los dos cortes verticales muestran la estructura\n * interna: el grueso acumulado en las zonas estancas del fondo y la zona viva\n * sobre los puntos de extraccion, que ningun instrumento del acopio puede\n * muestrear.\n *\n * Se dibujan en canvas y no en SVG porque cada vista tiene entre mil quinientas\n * y dos mil seiscientas celdas y se redibujan a cada cuadro de la animacion.\n */\n\nimport { useEffect, useRef } from \"react\";\n\nimport type { ColourMapId } from \"../colormaps\";\nimport { colourScale } from \"../colormaps\";\nimport type { Frame, FramesIndex } from \"../frames\";\n\nexport type Plane = \"plan\" | \"sectionEast\" | \"sectionNorth\";\n\ninterface OrthogonalViewProps {\n  index: FramesIndex;\n  frame: Frame;\n  plane: Plane;\n  width: number;\n  height: number;\n  showFeeders: boolean;\n  colourMapId: ColourMapId;\n}\n\nconst EMPTY_FILL = 0.02;\n\n/** Ancho reservado a la izquierda de los cortes para la regla de altura. */\nconst RULER_WIDTH = 34;\n\nexport function OrthogonalView({\n  index,\n  frame,\n  plane,\n  width,\n  height,\n  showFeeders,\n  colourMapId,\n}: OrthogonalViewProps): JSX.Element {\n  const canvasRef = useRef<HTMLCanvasElement>(null);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    const context = canvas?.getContext(\"2d\");\n\n    if (!canvas || !context) {\n      return;\n    }\n\n    const ratio = window.devicePixelRatio || 1;\n    canvas.width = width * ratio;\n    canvas.height = height * ratio;\n    context.setTransform(ratio, 0, 0, ratio, 0, 0);\n    context.clearRect(0, 0, width, height);\n\n    const colour = colourScale(colourMapId);\n\n    if (plane === \"plan\") {\n      drawPlan(context, index, frame, width, height, showFeeders, colour);\n    } else {\n      drawSection(context, index, frame, plane, width, height, showFeeders, colour);\n    }\n  }, [index, frame, plane, width, height, showFeeders, colourMapId]);\n\n  return (\n    <canvas\n      ref={canvasRef}\n      style={{ width: \"100%\", height: \"auto\", aspectRatio: `${width} / ${height}`, display: \"block\" }}\n    />\n  );\n}\n\n/** Vista en planta: tamano medio por columna sobre el plano Este-Norte. */\nfunction drawPlan(\n  context: CanvasRenderingContext2D,\n  index: FramesIndex,\n  frame: Frame,\n  width: number,\n  height: number,\n  showFeeders: boolean,\n  sizeColour: (fraction: number) => string,\n): void {\n  const { nEast, nNorth } = index.grid;\n  const cell = Math.min(width / nEast, height / nNorth) / Math.SQRT2;\n  const centreX = width / 2;\n  const centreY = height / 2;\n  const angle = -((index.rotationDeg ?? 0) * Math.PI) / 180;\n  const [minSize, maxSize] = index.sizeRangeIn;\n  const span = Math.max(maxSize - minSize, 1e-6);\n\n  context.save();\n  context.translate(centreX, centreY);\n  context.rotate(angle);\n  for (let north = 0; north < nNorth; north += 1) {\n    for (let east = 0; east < nEast; east += 1) {\n      const cellIndex = north * nEast + east;\n      const elevation = frame.height[cellIndex] ?? 0;\n\n      if (elevation <= 0) {\n        continue;\n      }\n\n      const size = (frame.columnSize[cellIndex] ?? 0) / index.scales.size;\n      context.fillStyle = sizeColour(size > 0 ? (size - minSize) / span : Number.NaN);\n      context.fillRect(\n        (east - nEast / 2) * cell,\n        (nNorth / 2 - 1 - north) * cell,\n        cell + 0.5,\n        cell + 0.5,\n      );\n    }\n  }\n  context.restore();\n\n  if (!showFeeders) {\n    return;\n  }\n\n  for (const feeder of index.feeders) {\n    const x = centreX + (feeder.east - index.grid.centreEast) * cell;\n    const y = centreY - (feeder.north - index.grid.centreNorth) * cell;\n    context.beginPath();\n    context.arc(x, y, 4.5, 0, Math.PI * 2);\n    context.fillStyle = feeder.line === 1 ? \"#007ED3\" : \"#E97132\";\n    context.fill();\n    context.strokeStyle = \"#ffffff\";\n    context.lineWidth = 1.5;\n    context.stroke();\n  }\n}\n\n/**\n * Corte vertical por el eje del cono.\n *\n * `sectionEast` corta a lo largo del eje Este y `sectionNorth` a lo largo del\n * Norte. Cada celda se pinta con su tamano propio, no con el promedio de la\n * columna: es la unica vista que expone la estratificacion interna.\n */\nfunction drawSection(\n  context: CanvasRenderingContext2D,\n  index: FramesIndex,\n  frame: Frame,\n  plane: Exclude<Plane, \"plan\">,\n  width: number,\n  height: number,\n  showFeeders: boolean,\n  sizeColour: (fraction: number) => string,\n): void {\n  const { nEast, nNorth, nVertical, cellSizeM } = index.grid;\n  const verticalCellSizeM = index.grid.verticalCellSizeM ?? cellSizeM;\n  const across = plane === \"sectionEast\" ? nEast : nNorth;\n  const sizes = plane === \"sectionEast\" ? frame.sectionEastSize : frame.sectionNorthSize;\n  const fills = plane === \"sectionEast\" ? frame.sectionEastFill : frame.sectionNorthFill;\n\n  const cell = Math.min((width - RULER_WIDTH) / across, (height - 18) / nVertical);\n  const offsetX = RULER_WIDTH + (width - RULER_WIDTH - cell * across) / 2;\n  const baseY = height - 14;\n  const [minSize, maxSize] = index.sizeRangeIn;\n  const span = Math.max(maxSize - minSize, 1e-6);\n\n  for (let lateral = 0; lateral < across; lateral += 1) {\n    for (let level = 0; level < nVertical; level += 1) {\n      const cellIndex = lateral * nVertical + level;\n      const fill = (fills[cellIndex] ?? 0) / index.scales.fill;\n\n      if (fill <= EMPTY_FILL) {\n        continue;\n      }\n\n      const size = (sizes[cellIndex] ?? 0) / index.scales.size;\n      context.globalAlpha = 0.35 + 0.65 * Math.min(1, fill);\n      context.fillStyle = sizeColour(size > 0 ? (size - minSize) / span : Number.NaN);\n      context.fillRect(\n        offsetX + lateral * cell,\n        baseY - (level + 1) * cell,\n        cell + 0.5,\n        cell + 0.5,\n      );\n    }\n  }\n\n  context.globalAlpha = 1;\n  context.strokeStyle = \"#5b6b70\";\n  context.lineWidth = 1;\n  context.beginPath();\n  context.moveTo(offsetX, baseY);\n  context.lineTo(offsetX + across * cell, baseY);\n  context.stroke();\n\n  drawHeightRuler(context, {\n    baseY,\n    metresPerPixel: verticalCellSizeM / cell,\n    topY: baseY - nVertical * cell,\n    rightX: offsetX,\n    plotRight: offsetX + across * cell,\n  });\n\n  if (!showFeeders) {\n    return;\n  }\n\n  for (const feeder of index.feeders) {\n    const angle = ((index.rotationDeg ?? 0) * Math.PI) / 180;\n    const publicEast = feeder.east - index.grid.centreEast;\n    const publicNorth = feeder.north - index.grid.centreNorth;\n    const sourceEast = publicEast * Math.cos(angle) + publicNorth * Math.sin(angle);\n    const sourceNorth = -publicEast * Math.sin(angle) + publicNorth * Math.cos(angle);\n    const lateral =\n      plane === \"sectionEast\"\n        ? index.grid.centreEast + sourceEast\n        : index.grid.centreNorth + sourceNorth;\n    const x = offsetX + (lateral + 0.5) * cell;\n    context.beginPath();\n    context.moveTo(x - 5, baseY + 9);\n    context.lineTo(x + 5, baseY + 9);\n    context.lineTo(x, baseY + 1);\n    context.closePath();\n    context.fillStyle = feeder.line === 1 ? \"#007ED3\" : \"#E97132\";\n    context.fill();\n  }\n}\n\ninterface RulerGeometry {\n  /** Coordenada de pantalla de la cota cero. */\n  baseY: number;\n  /** Metros de acopio por pixel de pantalla. */\n  metresPerPixel: number;\n  /** Coordenada de pantalla del techo de la grilla. */\n  topY: number;\n  /** Borde derecho de la regla, donde empieza el corte. */\n  rightX: number;\n  /** Borde derecho del corte, hasta donde llegan las lineas de guia. */\n  plotRight: number;\n}\n\n/**\n * Regla de altura al costado de un corte vertical.\n *\n * Sin ella el corte se lee como una figura sin escala: se ve que una zona es\n * mas alta que otra, pero no cuanto, y la altura del acopio es justamente la\n * variable que se reconcilia contra el sensor. El paso se elige de la serie\n * 1-2-5-10 para que las marcas caigan en numeros redondos con cualquier\n * exageracion de la vista.\n */\nfunction drawHeightRuler(context: CanvasRenderingContext2D, geometry: RulerGeometry): void {\n  const { baseY, metresPerPixel, topY, rightX, plotRight } = geometry;\n  const spanM = (baseY - topY) * metresPerPixel;\n\n  if (!Number.isFinite(spanM) || spanM <= 0) {\n    return;\n  }\n\n  const step = niceStep(spanM / 6);\n\n  context.save();\n  context.strokeStyle = \"#9aa8ad\";\n  context.fillStyle = \"#5b6b70\";\n  context.lineWidth = 1;\n  context.font = \"10px Arial, sans-serif\";\n  context.textAlign = \"right\";\n  context.textBaseline = \"middle\";\n\n  context.beginPath();\n  context.moveTo(rightX - 4, baseY);\n  context.lineTo(rightX - 4, topY);\n  context.stroke();\n\n  for (let metres = 0; metres <= spanM + 1e-9; metres += step) {\n    const y = baseY - metres / metresPerPixel;\n\n    context.beginPath();\n    context.moveTo(rightX - 9, y);\n    context.lineTo(rightX - 4, y);\n    context.stroke();\n\n    // Guia tenue sobre el corte: permite leer la cota de una cresta sin\n    // desplazar la mirada hasta el borde.\n    context.save();\n    context.globalAlpha = 0.18;\n    context.beginPath();\n    context.moveTo(rightX, y);\n    context.lineTo(plotRight, y);\n    context.stroke();\n    context.restore();\n\n    context.fillText(`${metres.toFixed(0)}`, rightX - 11, y);\n  }\n\n  context.textAlign = \"left\";\n  context.fillText(\"m\", 2, topY - 2);\n  context.restore();\n}\n\n/** Paso de marca redondeado a la serie 1-2-5-10. */\nfunction niceStep(raw: number): number {\n  if (!Number.isFinite(raw) || raw <= 0) {\n    return 1;\n  }\n\n  const magnitude = 10 ** Math.floor(Math.log10(raw));\n  const normalised = raw / magnitude;\n  const step = normalised <= 1 ? 1 : normalised <= 2 ? 2 : normalised <= 5 ? 5 : 10;\n\n  return step * magnitude;\n}\n"}, {"section": "Visor", "path": "app-src/src/components/HeightReconciliation.tsx", "description": "Altura y balance no modelado.", "language": "tsx", "source": "/**\n * Reconciliacion de la altura del acopio: simulada contra medida.\n *\n * Es la validacion mas directa del modelo. La medicion anonimizada registra una altura\n * real y el automata produce otra sobre la misma huella, de modo que la distancia\n * entre ambas curvas dice cuanto se aparta el acopio simulado del real sin\n * pasar por ningun supuesto de granulometria.\n *\n * Las barras\n * ----------\n * Bajo las curvas va el tonelaje no reconciliado entre las balanzas y el cambio\n * de inventario que explica el modelo. Crece durante transitorios y starving,\n * cuando errores de soporte temporal y material fuera de la carga viva pesan mas.\n *\n * Es la huella de lo que el modelo no representa. Una barra visible es\n * material cuyo destino no queda cerrado; en un caso real obligaria a\n * investigar instrumentacion y practicas operacionales antes de recalibrar.\n */\n\nimport type { LoadedRange } from \"../frames\";\nimport { formatNumber } from \"../theme\";\nimport {\n  DEFAULT_MARGINS,\n  axisLabel,\n  extentOf,\n  linePath,\n  linearScale,\n  padExtent,\n} from \"./chartAxes\";\n\nconst WIDTH = 1120;\nconst HEIGHT = 300;\n/** Fraccion de la altura reservada a las barras de balance, bajo las curvas. */\nconst BAR_BAND = 0.28;\n\nconst COLOUR_MEASURED = \"#434444\";\nconst COLOUR_SIMULATED = \"#007ED3\";\nconst COLOUR_UNMODELLED = \"#E8B22C\";\n\ninterface HeightReconciliationProps {\n  range: LoadedRange;\n  frameIndex: number;\n  /** Altura de diseno; `null` cuando el export no la declara. */\n  designHeightM: number | null;\n  onFrameChange: (position: number) => void;\n}\n\nexport function HeightReconciliation({\n  range,\n  frameIndex,\n  designHeightM,\n  onFrameChange,\n}: HeightReconciliationProps): JSX.Element | null {\n  const series = range.reconciliation;\n\n  if (!series) {\n    return null;\n  }\n\n  const simulated = series.simulatedHeightM;\n  const measured = series.measuredHeightM;\n  const unmodelled = series.unmodelledT;\n  const count = simulated.length;\n\n  if (count === 0) {\n    return null;\n  }\n\n  const margins = DEFAULT_MARGINS;\n  const plotWidth = WIDTH - margins.left - margins.right;\n  const plotHeight = HEIGHT - margins.top - margins.bottom;\n  const barTop = margins.top + plotHeight * (1 - BAR_BAND);\n  const lineBottom = barTop - 8;\n\n  const x = (position: number): number =>\n    margins.left + (count <= 1 ? plotWidth / 2 : (position / (count - 1)) * plotWidth);\n\n  const heightDomain = padExtent(\n    extentOf(simulated, measured, designHeightM === null ? [] : [designHeightM]),\n  );\n  const y = linearScale(heightDomain, [lineBottom, margins.top]);\n\n  const peakUnmodelled = Math.max(\n    ...unmodelled.map((value) => (value === null ? 0 : Math.abs(value))),\n    1e-6,\n  );\n  const barScale = linearScale([0, peakUnmodelled], [0, plotHeight * BAR_BAND - 6]);\n\n  const totalUnmodelledT = unmodelled.reduce<number>(\n    (total, value) => total + (value ?? 0),\n    0,\n  );\n  const residuals = simulated\n    .map((value, position) =>\n      value === null || measured[position] === null ? null : value - measured[position]!,\n    )\n    .filter((value): value is number => value !== null);\n  const meanResidual =\n    residuals.length > 0\n      ? residuals.reduce((total, value) => total + value, 0) / residuals.length\n      : Number.NaN;\n\n  const barWidth = Math.max(1, plotWidth / count - 0.5);\n\n  return (\n    <figure className=\"reconciliation\">\n      <figcaption>\n        <strong>Reconciliacion de altura del acopio<\/strong>\n        <span>\n          Medición del escenario pedagógico sobre el corredor de extracción contra la huella equivalente del modelo. Sesgo medio{\" \"}\n          {Number.isFinite(meanResidual) ? `${meanResidual >= 0 ? \"+\" : \"\"}${formatNumber(meanResidual, 2)} m` : \"n/d\"}{\" \"}\n          en el rango.\n        <\/span>\n      <\/figcaption>\n\n      <svg\n        viewBox={`0 0 ${WIDTH} ${HEIGHT}`}\n        className=\"reconciliation-svg\"\n        role=\"img\"\n        aria-label=\"Altura simulada contra medida, con el tonelaje no modelado en barras\"\n        onClick={(event) => {\n          const box = event.currentTarget.getBoundingClientRect();\n          const ratio = (event.clientX - box.left) / box.width;\n          const position = Math.round(ratio * WIDTH);\n          const fraction = (position - margins.left) / plotWidth;\n          onFrameChange(Math.min(count - 1, Math.max(0, Math.round(fraction * (count - 1)))));\n        }}\n      >\n        {y.ticks(5).map((tick) => (\n          <g key={`h-${tick}`}>\n            <line\n              x1={margins.left}\n              x2={WIDTH - margins.right}\n              y1={y(tick)}\n              y2={y(tick)}\n              stroke=\"#e3e5e4\"\n            />\n            <text x={margins.left - 6} y={y(tick) + 4} textAnchor=\"end\" className=\"axis-text\">\n              {axisLabel(tick)}\n            <\/text>\n          <\/g>\n        ))}\n\n        {/* Altura de diseno: por sobre ella el acopio simulado deja de ser fisico. */}\n        {designHeightM === null ? null : (\n          <>\n            <line\n              x1={margins.left}\n              x2={WIDTH - margins.right}\n              y1={y(designHeightM)}\n              y2={y(designHeightM)}\n              stroke=\"#D37154\"\n              strokeDasharray=\"6 4\"\n            />\n            <text x={WIDTH - margins.right + 4} y={y(designHeightM) + 4} className=\"axis-text\">\n              diseno\n            <\/text>\n          <\/>\n        )}\n\n        {unmodelled.map((value, position) =>\n          value === null || value <= 0 ? null : (\n            <rect\n              key={`bar-${position}`}\n              x={x(position) - barWidth / 2}\n              y={barTop}\n              width={barWidth}\n              height={barScale(value)}\n              fill={COLOUR_UNMODELLED}\n              opacity={0.85}\n            />\n          ),\n        )}\n\n        <line\n          x1={margins.left}\n          x2={WIDTH - margins.right}\n          y1={barTop}\n          y2={barTop}\n          stroke=\"#bac4c8\"\n        />\n        <text x={margins.left - 6} y={barTop + 4} textAnchor=\"end\" className=\"axis-text\">\n          0\n        <\/text>\n        <text\n          x={WIDTH - margins.right + 4}\n          y={barTop + 14}\n          className=\"axis-text\"\n        >\n          t/cuadro\n        <\/text>\n\n        <path d={linePath(measured, x, y)} fill=\"none\" stroke={COLOUR_MEASURED} strokeWidth={1.8} />\n        <path\n          d={linePath(simulated, x, y)}\n          fill=\"none\"\n          stroke={COLOUR_SIMULATED}\n          strokeWidth={1.8}\n        />\n\n        <line\n          x1={x(frameIndex)}\n          x2={x(frameIndex)}\n          y1={margins.top}\n          y2={margins.top + plotHeight}\n          stroke=\"#1C434B\"\n          strokeWidth={1}\n          opacity={0.55}\n        />\n\n        <text x={margins.left} y={HEIGHT - 8} className=\"axis-text\">\n          {range.fromDay}\n        <\/text>\n        <text x={WIDTH - margins.right} y={HEIGHT - 8} textAnchor=\"end\" className=\"axis-text\">\n          {range.toDay}\n        <\/text>\n        <text\n          x={margins.left - 6}\n          y={margins.top - 4}\n          textAnchor=\"end\"\n          className=\"axis-text\"\n        >\n          m\n        <\/text>\n      <\/svg>\n\n      <ul className=\"reconciliation-key\">\n        <li>\n          <span className=\"swatch\" style={{ background: COLOUR_MEASURED }} /> Altura medida\n        <\/li>\n        <li>\n          <span className=\"swatch\" style={{ background: COLOUR_SIMULATED }} /> Altura simulada\n        <\/li>\n        <li>\n          <span className=\"swatch\" style={{ background: COLOUR_UNMODELLED }} /> Balance no\n          modelado\n        <\/li>\n      <\/ul>\n\n      <p className=\"reconciliation-note\">\n        <strong>\n          Las barras son mineral que el modelo no explica:{\" \"}\n          {formatNumber(totalUnmodelledT / 1000, 1)} kt en este rango.\n        <\/strong>{\" \"}\n        Las balanzas dicen que entro mas material del que el acopio puede contener. Puede existir\n        un flujo omitido o una inconsistencia instrumental: donde hay barra, hay material cuya\n        trayectoria el modelo desconoce y una hipotesis que debe investigarse antes de recalibrar.\n      <\/p>\n    <\/figure>\n  );\n}\n"}, {"section": "Visor", "path": "app-src/src/components/SizeReconciliation.tsx", "description": "PSD medida y P80 simulado.", "language": "tsx", "source": "/**\n * Reconciliacion granulometrica por linea de molienda.\n *\n * Una curva por linea, en escala logaritmica de tamano, que es como se lee una\n * granulometria: el rango util abarca casi tres decadas y en escala lineal el\n * extremo fino queda aplastado contra el eje.\n *\n * Cada panel muestra la curva medida por la camara de descarga de esa linea,\n * la de alimentacion como referencia, y el P80 simulado marcado sobre\n * el 80 % de pasante. Las tres bandas de fondo son las clases de la operacion:\n * fino bajo 1 pulgada, intermedio entre 1 y 4, grueso sobre 4.\n *\n * Que se puede validar y que no\n * -----------------------------\n * El automata propaga UN tamano caracteristico por celda, de modo que produce\n * P80 y nada mas: la curva es enteramente medicion y el unico punto simulado es\n * el marcador del 80 %. Ademas las tres camaras no estan calibradas entre si\n * -- las de descarga leen unas 0.8 pulgadas mas fino que la de alimentacion --\n * asi que el nivel absoluto no es comparable y la diferencia entre lineas si.\n */\n\nimport { DECILES } from \"../frames\";\nimport type { LoadedRange, ReconciliationSeries } from \"../frames\";\nimport { formatSigned } from \"../theme\";\nimport type { SizeUnit } from \"../units\";\nimport { formatSize, formatTick, toUnit, unitSuffix } from \"../units\";\nimport { decadeTicks, logScale, linearScale } from \"./chartAxes\";\n\nconst WIDTH = 520;\nconst HEIGHT = 300;\nconst MARGINS = { top: 16, right: 18, bottom: 40, left: 46 };\n\nconst COLOUR_LINE1 = \"#007ED3\";\nconst COLOUR_LINE2 = \"#E97132\";\nconst COLOUR_FEED = \"#8a9296\";\nconst COLOUR_SIMULATED = \"#1C434B\";\n\n/** Limites de clase de las camaras Split, en pulgadas. */\nconst FINE_CUT_IN = 1;\nconst COARSE_CUT_IN = 4;\n\n/** Extremos del eje de tamano en pulgadas, fijos para que ambos paneles sean comparables. */\nconst SIZE_DOMAIN_IN: readonly [number, number] = [0.05, 20];\n\nconst ZONES = [\n  { from: SIZE_DOMAIN_IN[0], to: FINE_CUT_IN, label: \"fino\", fill: \"#eef4f6\" },\n  { from: FINE_CUT_IN, to: COARSE_CUT_IN, label: \"intermedio\", fill: \"#fbf6e8\" },\n  { from: COARSE_CUT_IN, to: SIZE_DOMAIN_IN[1], label: \"grueso\", fill: \"#fbeee9\" },\n] as const;\n\ninterface SizeReconciliationProps {\n  range: LoadedRange;\n  sizeUnit: SizeUnit;\n}\n\nexport function SizeReconciliation({\n  range,\n  sizeUnit,\n}: SizeReconciliationProps): JSX.Element | null {\n  const series = range.reconciliation;\n\n  if (!series || series.simulatedLine1P80In.length === 0) {\n    return null;\n  }\n\n  const deltaSimulated = meanOfDifference(\n    series.simulatedLine2P80In,\n    series.simulatedLine1P80In,\n  );\n  const deltaMeasured = meanOfDifference(series.measuredLine2P80In, series.measuredLine1P80In);\n\n  return (\n    <figure className=\"reconciliation\">\n      <figcaption>\n        <strong>Reconciliacion granulometrica<\/strong>\n        <span>\n          Media del rango. La diferencia entre lineas es lo unico comparable: simulada{\" \"}\n          {formatSigned(toUnit(deltaSimulated, sizeUnit), sizeUnit === \"mm\" ? 1 : 3)}\n          {unitSuffix(sizeUnit)} contra medida{\" \"}\n          {formatSigned(toUnit(deltaMeasured, sizeUnit), sizeUnit === \"mm\" ? 1 : 3)}\n          {unitSuffix(sizeUnit)}.\n        <\/span>\n      <\/figcaption>\n\n      <div className=\"reconciliation-split\">\n        <LinePanel series={series} line={1} sizeUnit={sizeUnit} />\n        <LinePanel series={series} line={2} sizeUnit={sizeUnit} />\n      <\/div>\n\n      <ul className=\"reconciliation-key\">\n        <li>\n          <span className=\"swatch\" style={{ background: COLOUR_LINE1 }} /> Linea A medida\n        <\/li>\n        <li>\n          <span className=\"swatch\" style={{ background: COLOUR_LINE2 }} /> Linea B medida\n        <\/li>\n        <li>\n          <span className=\"swatch is-dashed\" style={{ color: COLOUR_FEED }} /> Alimentacion,\n          referencia\n        <\/li>\n        <li>\n          <span className=\"swatch is-marker\" style={{ background: COLOUR_SIMULATED }} /> P80\n          simulado\n        <\/li>\n      <\/ul>\n\n      <p className=\"reconciliation-note\">\n        La curva es <strong>enteramente medicion<\/strong>: el automata propaga un solo tamano por\n        celda, de modo que su unica salida es el P80 marcado sobre el 80 %. El nivel absoluto\n        tampoco es comparable, porque las camaras de descarga leen {formatSize(0.83, sizeUnit)}{\" \"}\n        mas fino en F80 que la de entrada y el modelo se alimenta de esa medicion. Lo valido es la diferencia\n        entre lineas.\n      <\/p>\n    <\/figure>\n  );\n}\n\n/** Panel de una linea: su curva medida, la alimentacion y el P80 simulado. */\nfunction LinePanel({\n  series,\n  line,\n  sizeUnit,\n}: {\n  series: ReconciliationSeries;\n  line: 1 | 2;\n  sizeUnit: SizeUnit;\n}): JSX.Element {\n  const plotHeight = HEIGHT - MARGINS.top - MARGINS.bottom;\n  const colour = line === 1 ? COLOUR_LINE1 : COLOUR_LINE2;\n  const camera = line === 1 ? \"sensor A\" : \"sensor B\";\n\n  /*\n   * La escala se construye sobre el dominio YA convertido, de modo que las\n   * marcas de decada caigan en numeros redondos de la unidad elegida -- 1, 2, 5,\n   * 10 mm -- y no en pulgadas traducidas. Los datos se convierten al dibujar.\n   */\n  const domain: readonly [number, number] = [\n    toUnit(SIZE_DOMAIN_IN[0], sizeUnit),\n    toUnit(SIZE_DOMAIN_IN[1], sizeUnit),\n  ];\n  const scale = logScale(domain, [MARGINS.left, WIDTH - MARGINS.right]);\n  const x = (inches: number): number => scale(toUnit(inches, sizeUnit));\n  const y = linearScale([0, 100], [MARGINS.top + plotHeight, MARGINS.top]);\n\n  const measured = decilePoints(series, `measuredLine${line}P`, `measuredLine${line}TopsizeIn`);\n  const feed = decilePoints(series, \"measuredFeedF\", \"measuredFeedTopsizeIn\");\n  const simulatedP80 = meanOf(series[`simulatedLine${line}P80In`] ?? []);\n  const measuredP80 = meanOf(series[`measuredLine${line}P80In`] ?? []);\n\n  return (\n    <svg\n      viewBox={`0 0 ${WIDTH} ${HEIGHT}`}\n      className=\"reconciliation-svg\"\n      role=\"img\"\n      aria-label={`Curva granulometrica de la linea ${line}`}\n    >\n      {ZONES.map((zone) => (\n        <g key={zone.label}>\n          <rect\n            x={x(zone.from)}\n            y={MARGINS.top}\n            width={x(zone.to) - x(zone.from)}\n            height={plotHeight}\n            fill={zone.fill}\n          />\n          <text\n            x={(x(zone.from) + x(zone.to)) / 2}\n            y={MARGINS.top + 12}\n            textAnchor=\"middle\"\n            className=\"axis-caption\"\n          >\n            {zone.label}\n          <\/text>\n        <\/g>\n      ))}\n\n      {[FINE_CUT_IN, COARSE_CUT_IN].map((cut) => (\n        <line\n          key={cut}\n          x1={x(cut)}\n          x2={x(cut)}\n          y1={MARGINS.top}\n          y2={MARGINS.top + plotHeight}\n          stroke=\"#c9d3d7\"\n        />\n      ))}\n\n      {y.ticks(5).map((tick) => (\n        <g key={`p-${tick}`}>\n          <line\n            x1={MARGINS.left}\n            x2={WIDTH - MARGINS.right}\n            y1={y(tick)}\n            y2={y(tick)}\n            stroke=\"#e3e5e4\"\n          />\n          <text x={MARGINS.left - 6} y={y(tick) + 4} textAnchor=\"end\" className=\"axis-text\">\n            {tick.toFixed(0)}\n          <\/text>\n        <\/g>\n      ))}\n\n      {decadeTicks(domain[0], domain[1]).map((tick) => (\n        <text\n          key={`s-${tick}`}\n          x={scale(tick)}\n          y={HEIGHT - 22}\n          textAnchor=\"middle\"\n          className=\"axis-text\"\n        >\n          {formatTick(tick)}\n        <\/text>\n      ))}\n\n      <line\n        x1={MARGINS.left}\n        x2={WIDTH - MARGINS.right}\n        y1={y(80)}\n        y2={y(80)}\n        stroke=\"#98a4a8\"\n        strokeDasharray=\"4 3\"\n      />\n\n      <Curve points={feed} x={x} y={y} colour={COLOUR_FEED} dashed />\n      <Curve points={measured} x={x} y={y} colour={colour} />\n\n      {Number.isFinite(simulatedP80) ? (\n        <g>\n          <line\n            x1={x(simulatedP80)}\n            x2={x(simulatedP80)}\n            y1={y(80)}\n            y2={MARGINS.top + plotHeight}\n            stroke={COLOUR_SIMULATED}\n            strokeWidth={2}\n            strokeDasharray=\"5 3\"\n          />\n          <circle cx={x(simulatedP80)} cy={y(80)} r={4} fill={COLOUR_SIMULATED} />\n        <\/g>\n      ) : null}\n\n      <text x={MARGINS.left} y={MARGINS.top - 4} className=\"axis-text\">\n        Línea {line} – {camera === \"sensor A\" ? \"Sensor A\" : \"Sensor B\"}\n      <\/text>\n      <text x={WIDTH - MARGINS.right} y={HEIGHT - 6} textAnchor=\"end\" className=\"axis-caption\">\n        tamano ({sizeUnit === \"mm\" ? \"mm\" : \"pulgadas\"}), escala log\n      <\/text>\n      <text x={MARGINS.left - 6} y={MARGINS.top - 4} textAnchor=\"end\" className=\"axis-text\">\n        %\n      <\/text>\n      <text x={MARGINS.left} y={HEIGHT - 6} className=\"axis-caption\">\n        P80 medido {formatSize(measuredP80, sizeUnit)} – Simulado {formatSize(simulatedP80, sizeUnit)}\n      <\/text>\n    <\/svg>\n  );\n}\n\nfunction Curve({\n  points,\n  x,\n  y,\n  colour,\n  dashed = false,\n}: {\n  points: DecilePoint[];\n  x: (value: number) => number;\n  y: (value: number) => number;\n  colour: string;\n  dashed?: boolean;\n}): JSX.Element | null {\n  if (points.length === 0) {\n    return null;\n  }\n\n  const path = points\n    .map(\n      (point, position) =>\n        `${position === 0 ? \"M\" : \"L\"}${x(point.sizeIn).toFixed(1)} ${y(point.passingPct).toFixed(1)}`,\n    )\n    .join(\" \");\n\n  return (\n    <g>\n      <path\n        d={path}\n        fill=\"none\"\n        stroke={colour}\n        strokeWidth={2}\n        strokeDasharray={dashed ? \"5 3\" : undefined}\n      />\n      {points.map((point) => (\n        <circle\n          key={point.passingPct}\n          cx={x(point.sizeIn)}\n          cy={y(point.passingPct)}\n          r={2.2}\n          fill={colour}\n        />\n      ))}\n    <\/g>\n  );\n}\n\ninterface DecilePoint {\n  sizeIn: number;\n  passingPct: number;\n}\n\n/** Puntos de la curva de una camara, del decil mas fino al tamano maximo. */\nfunction decilePoints(\n  series: ReconciliationSeries,\n  prefix: string,\n  topsizeKey: string,\n): DecilePoint[] {\n  const points: DecilePoint[] = [];\n\n  for (const decile of DECILES) {\n    const value = meanOf(series[`${prefix}${decile}In`] ?? []);\n\n    if (Number.isFinite(value) && value > 0) {\n      points.push({ sizeIn: value, passingPct: decile });\n    }\n  }\n\n  const topsize = meanOf(series[topsizeKey] ?? []);\n\n  if (Number.isFinite(topsize) && topsize > 0) {\n    points.push({ sizeIn: topsize, passingPct: 100 });\n  }\n\n  return points;\n}\n\n/** Media de una serie ignorando huecos; `NaN` si no hay ningun valor. */\nfunction meanOf(values: readonly (number | null)[]): number {\n  let total = 0;\n  let seen = 0;\n\n  for (const value of values) {\n    if (value === null || !Number.isFinite(value)) {\n      continue;\n    }\n\n    total += value;\n    seen += 1;\n  }\n\n  return seen > 0 ? total / seen : Number.NaN;\n}\n\n/** Media de la diferencia punto a punto, solo sobre los cuadros con ambos valores. */\nfunction meanOfDifference(\n  minuend: readonly (number | null)[],\n  subtrahend: readonly (number | null)[],\n): number {\n  let total = 0;\n  let seen = 0;\n\n  for (const [position, value] of minuend.entries()) {\n    const other = subtrahend[position];\n\n    if (value === null || other === null || other === undefined) {\n      continue;\n    }\n\n    total += value - other;\n    seen += 1;\n  }\n\n  return seen > 0 ? total / seen : Number.NaN;\n}\n"}];const nav=document.getElementById('steps'),source=document.getElementById('source'),search=document.getElementById('search');let current=0;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function visible(){const q=search.value.trim().toLowerCase();return FILES.map((f,i)=>[f,i]).filter(([f])=>!q||`${f.section} ${f.path} ${f.description}`.toLowerCase().includes(q)).map(([,i])=>i)}
function renderNav(){nav.innerHTML='';visible().forEach(i=>{const f=FILES[i],b=document.createElement('button');b.className='step'+(i===current?' active':'');b.innerHTML=`<small>${String(i+1).padStart(2,'0')} · ${esc(f.section)}</small>${esc(f.path)}`;b.onclick=()=>show(i);nav.appendChild(b)})}
function show(i){current=Math.max(0,Math.min(FILES.length-1,i));const f=FILES[current];document.getElementById('section').textContent=f.section;document.getElementById('path').textContent=f.path;document.getElementById('description').textContent=f.description;document.getElementById('counter').textContent=`${current+1} / ${FILES.length}`;source.innerHTML=esc(f.source);document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===FILES.length-1;renderNav();document.querySelector('.code-wrap').scrollTop=0}
search.oninput=renderNav;document.getElementById('previous').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('copy').onclick=async e=>{await navigator.clipboard.writeText(FILES[current].source);e.target.textContent='Copiado';setTimeout(()=>e.target.textContent='Copiar',900)};document.addEventListener('keydown',e=>{if(e.target===search)return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(0);</script></body></html>
