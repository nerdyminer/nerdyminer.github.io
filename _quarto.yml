project:
  type: website
  output-dir: docs
  # El prefijo `/` ancla los globs a la raíz del proyecto. Sin él, Quarto los
  # busca recursivamente y puede entrar en directorios efímeros como `.git`.
  resources:
    - /proyectos/bayesian-tph-forecasting/app/**
    - /proyectos/bayesian-tph-forecasting/assets/**
    - /proyectos/bayesian-tph-forecasting/build/**
    - /proyectos/bayesian-tph-forecasting/source/**
    - /proyectos/bayesian-tph-forecasting/conf/**
    - /proyectos/bayesian-tph-forecasting/data/01_raw/**
    - /proyectos/bayesian-tph-forecasting/src/**
    - /proyectos/bayesian-tph-forecasting/tests/**
    - /proyectos/bayesian-tph-forecasting/README.md
    - /proyectos/bayesian-tph-forecasting/LICENSE
    - /proyectos/bayesian-tph-forecasting/pyproject.toml
    - /proyectos/bayesian-tph-forecasting/uv.lock
    - /proyectos/stockpile-cellular-automata/app/**
    - /proyectos/stockpile-cellular-automata/assets/**
    - /proyectos/stockpile-cellular-automata/dagster/**
    - /proyectos/stockpile-cellular-automata/source/**
    - /proyectos/stockpile-cellular-automata/conf/**
    - /proyectos/stockpile-cellular-automata/src/**
    - /proyectos/stockpile-cellular-automata/tests/**
    - /proyectos/stockpile-cellular-automata/scripts/**
    - /proyectos/stockpile-cellular-automata/README.md
    - /proyectos/stockpile-cellular-automata/pyproject.toml
    - /proyectos/stockpile-cellular-automata/uv.lock
    # Evita publicar residuos locales incluidos por los globs anteriores.
    - "!/proyectos/bayesian-tph-forecasting/**/.DS_Store"
    - "!/proyectos/bayesian-tph-forecasting/**/__pycache__/**"
    - "!/proyectos/bayesian-tph-forecasting/**/*.pyc"
    - "!/proyectos/bayesian-tph-forecasting/**/.pytest_cache/**"
    - "!/proyectos/bayesian-tph-forecasting/**/.ruff_cache/**"
    - "!/proyectos/stockpile-cellular-automata/**/.DS_Store"
    - "!/proyectos/stockpile-cellular-automata/**/__pycache__/**"
    - "!/proyectos/stockpile-cellular-automata/**/*.pyc"
    - "!/proyectos/stockpile-cellular-automata/**/.dagster_home/**"
    - "!/proyectos/stockpile-cellular-automata/**/.pytest_cache/**"
    - "!/proyectos/stockpile-cellular-automata/**/.ruff_cache/**"
    - "!/proyectos/stockpile-cellular-automata/**/.uv-cache/**"
    - "!/proyectos/stockpile-cellular-automata/**/.venv/**"
    - "!/proyectos/stockpile-cellular-automata/app-src/node_modules/**"
    - "!/proyectos/stockpile-cellular-automata/app-src/dist/**"
    - "!/proyectos/stockpile-cellular-automata/scripts/build_anonymized_scenario.py"
    - "!/proyectos/stockpile-cellular-automata/source/transformation_manifest.json"
  # Genera el orden anterior/siguiente de las entradas desde `number-offset`
  # antes de renderizar (ver scripts/build-notes-order.py).
  pre-render:
    - scripts/build-notes-order.py
    - scripts/build-bayesian-source-explorer.py
    - proyectos/stockpile-cellular-automata/scripts/build_source_explorer.py

website:
  title: "NerdyMiner"
  navbar:
    logo: images/nerdyminer-icon.svg
    logo-alt: "NerdyMiner"
    left:
      - href: index.qmd
        text: Inicio
      - href: articulos/index.qmd
        text: Artículos
      - href: apuntes/index.qmd
        text: Apuntes
      - href: clases/index.qmd
        text: Clases
      - href: bibliografia.qmd
        text: Bibliografía
      - href: proyectos/index.qmd
        text: Proyectos
      - href: licencia.qmd
        text: Licencia
      - href: sobre-mi.qmd
        text: Sobre mí
  search: true
  page-footer:
    left: "© René Quezada"
    right: "Este blog fue construido con mucho ❤️ en Quarto"

format:
  html:
    # Sistema claro/oscuro: Litera (claro) + Slate (oscuro).
    # Quarto inyecta automáticamente el botón de alternancia en el navbar.
    # El tema anterior (sandstone + styles-sandstone.scss) se conserva en
    # disco como respaldo, fuera del build.
    theme:
      light:
        - litera
        - styles-litera.scss
      dark:
        - slate
        - styles-slate.scss
    toc: true
    toc-location: right
    smooth-scroll: true
    include-after-body: _includes/notes-prev-next.html

# Cachea la ejecución de los notebooks: sólo se re-ejecuta un documento si
# cambia su código/fuente. Los ajustes de estilo (SCSS) re-renderizan en
# segundos sin volver a correr Python.
execute:
  freeze: auto

filters:
  - _extensions/custom/back-to-section.lua
  - _extensions/custom/kedro-brand.lua

crossref:
  chapters: true
  fig-title: Figura
  tbl-title: Tabla
  fig-prefix: Figura
  tbl-prefix: Tabla
  custom:
    - kind: float
      key: alg
      reference-prefix: Algoritmo
      caption-prefix: Algoritmo
      caption-location: bottom
